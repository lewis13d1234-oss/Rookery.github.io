a partida, por isso h\u00e1 um bispo \u00abde casas claras\u00bb e outro \u00abde casas escuras\u00bb. Dois bispos juntos cobrem todas as casas.", "Un alfiere scivola a qualsiasi distanza lungo una diagonale finch\u00e9 qualcosa lo ferma. Ogni alfiere resta sullo stesso colore di casa per tutta la partita, perci\u00f2 c'\u00e8 un alfiere \u00abdi case chiare\u00bb e uno \u00abdi case scure\u00bb. I due alfieri insieme coprono tutte le case."], "Click every square the bishop on d4 can move to.": ["Haz clic en cada casilla a la que puede ir el alfil de d4.", "Cliquez sur chaque case o\u00f9 peut aller le fou en d4.", "Klicke auf jedes Feld, auf das der L\u00e4ufer auf d4 ziehen kann.", "Clique em cada casa para onde o bispo de d4 se pode mover.", "Clicca su ogni casa in cui pu\u00f2 andare l'alfiere in d4."], "Straight lines": ["L\u00edneas rectas", "En ligne droite", "Gerade Linien", "Linhas retas", "Linee rette"], "Rooks move any distance horizontally or vertically. They are strongest on **open files** (files with no pawns) and on the seventh rank. A rook is worth about five pawns.": ["Las torres se mueven cualquier distancia en horizontal o vertical. Son m\u00e1s fuertes en **columnas abiertas** (sin peones) y en la s\u00e9ptima fila. Una torre vale unos cinco peones.", "Les tours se d\u00e9placent horizontalement ou verticalement, sur n'importe quelle distance. Elles sont plus fortes sur les **colonnes ouvertes** (sans pions) et sur la septi\u00e8me rang\u00e9e. Une tour vaut environ cinq pions.", "T\u00fcrme ziehen beliebig weit waagerecht oder senkrecht. Am st\u00e4rksten sind sie auf **offenen Linien** (ohne Bauern) und auf der siebten Reihe. Ein Turm ist etwa f\u00fcnf Bauern wert.", "As torres movem-se qualquer dist\u00e2ncia na horizontal ou vertical. S\u00e3o mais fortes em **colunas abertas** (sem pe\u00f5es) e na s\u00e9tima fileira. Uma torre vale cerca de cinco pe\u00f5es.", "Le torri si muovono a qualsiasi distanza in orizzontale o in verticale. Sono pi\u00f9 forti sulle **colonne aperte** (senza pedoni) e sulla settima traversa. Una torre vale circa cinque pedoni."], "Click every square the rook on d4 can move to (14 squares).": ["Haz clic en cada casilla a la que puede ir la torre de d4 (14 casillas).", "Cliquez sur chaque case o\u00f9 peut aller la tour en d4 (14 cases).", "Klicke auf jedes Feld, auf das der Turm auf d4 ziehen kann (14 Felder).", "Clique em cada casa para onde a torre de d4 se pode mover (14 casas).", "Clicca su ogni casa in cui pu\u00f2 andare la torre in d4 (14 case)."], "The most powerful piece": ["La pieza m\u00e1s poderosa", "La pi\u00e8ce la plus puissante", "Die m\u00e4chtigste Figur", "A pe\u00e7a mais poderosa", "Il pezzo pi\u00f9 potente"], "The queen moves like a rook and a bishop combined. She is worth about nine pawns, so don't bring her out too early \u2014 she can be chased by lesser pieces.": ["La dama se mueve como una torre y un alfil juntos. Vale unos nueve peones, as\u00ed que no la saques demasiado pronto: las piezas menores pueden perseguirla.", "La dame se d\u00e9place comme une tour et un fou r\u00e9unis. Elle vaut environ neuf pions : ne la sortez pas trop t\u00f4t, des pi\u00e8ces plus faibles peuvent la chasser.", "Die Dame zieht wie Turm und L\u00e4ufer zusammen. Sie ist etwa neun Bauern wert, bring sie also nicht zu fr\u00fch heraus \u2013 schw\u00e4chere Figuren k\u00f6nnen sie jagen.", "A dama move-se como uma torre e um bispo juntos. Vale cerca de nove pe\u00f5es, por isso n\u00e3o a traga cedo demais: pe\u00e7as menores podem persegui-la.", "La donna si muove come una torre e un alfiere insieme. Vale circa nove pedoni, quindi non portarla fuori troppo presto: i pezzi minori possono darle la caccia."], "Click every square the queen on d4 can reach.": ["Haz clic en cada casilla a la que llega la dama de d4.", "Cliquez sur chaque case que peut atteindre la dame en d4.", "Klicke auf jedes Feld, das die Dame auf d4 erreichen kann.", "Clique em cada casa que a dama de d4 pode alcan\u00e7ar.", "Clicca su ogni casa che la donna in d4 pu\u00f2 raggiungere."], "Slow but vital": ["Lento pero vital", "Lent mais vital", "Langsam, aber lebenswichtig", "Lento mas vital", "Lento ma vitale"], "The king moves one square in any direction but can **never** move to a square attacked by the opponent. Lose the king and you lose the game, so keep him safe in the opening and middlegame \u2014 and active in the endgame.": ["El rey se mueve una casilla en cualquier direcci\u00f3n, pero **nunca** a una casilla atacada por el rival. Si pierdes el rey pierdes la partida: mantenlo a salvo en la apertura y el medio juego, y activo en el final.", "Le roi se d\u00e9place d'une case dans toutes les directions mais **jamais** sur une case attaqu\u00e9e par l'adversaire. Perdre le roi, c'est perdre la partie : prot\u00e9gez-le en ouverture et au milieu de jeu, et activez-le en finale.", "Der K\u00f6nig zieht ein Feld in jede Richtung, aber **nie** auf ein Feld, das der Gegner angreift. Verlierst du den K\u00f6nig, verlierst du die Partie: Halte ihn in Er\u00f6ffnung und Mittelspiel sicher \u2013 und im Endspiel aktiv.", "O rei move-se uma casa em qualquer dire\u00e7\u00e3o, mas **nunca** para uma casa atacada pelo advers\u00e1rio. Perder o rei \u00e9 perder a partida: mantenha-o seguro na abertura e no meio-jogo \u2014 e ativo no final.", "Il re si muove di una casa in qualsiasi direzione ma **mai** su una casa attaccata dall'avversario. Perdere il re significa perdere la partita: tienilo al sicuro in apertura e nel mediogioco, e attivo nel finale."], "Click every square the king on e4 can move to.": ["Haz clic en cada casilla a la que puede ir el rey de e4.", "Cliquez sur chaque case o\u00f9 peut aller le roi en e4.", "Klicke auf jedes Feld, auf das der K\u00f6nig auf e4 ziehen kann.", "Clique em cada casa para onde o rei de e4 se pode mover.", "Clicca su ogni casa in cui pu\u00f2 andare il re in e4."], "Check": ["Jaque", "L'\u00e9chec", "Schach", "Xeque", "Scacco"], "When the king is attacked it is **in check**. You must respond immediately by moving the king, blocking, or capturing the attacker.": ["Cuando el rey es atacado est\u00e1 **en jaque**. Debes responder de inmediato moviendo el rey, bloqueando o capturando la pieza atacante.", "Quand le roi est attaqu\u00e9, il est **en \u00e9chec**. Il faut r\u00e9pondre aussit\u00f4t en d\u00e9pla\u00e7ant le roi, en bloquant ou en prenant la pi\u00e8ce qui attaque.", "Wird der K\u00f6nig angegriffen, steht er **im Schach**. Du musst sofort reagieren: den K\u00f6nig ziehen, den Angriff blockieren oder den Angreifer schlagen.", "Quando o rei \u00e9 atacado, est\u00e1 **em xeque**. Tem de responder de imediato: mover o rei, bloquear ou capturar a pe\u00e7a atacante.", "Quando il re \u00e8 attaccato \u00e8 **sotto scacco**. Devi rispondere subito spostando il re, bloccando o catturando il pezzo attaccante."], "Checkmate": ["Jaque mate", "L'\u00e9chec et mat", "Schachmatt", "Xeque-mate", "Scacco matto"], "If there is no way to escape check, it is **checkmate** and the game is over. The side that delivers mate wins.": ["Si no hay forma de escapar del jaque, es **jaque mate** y la partida termina. Gana el bando que da mate.", "S'il n'y a aucun moyen d'\u00e9chapper \u00e0 l'\u00e9chec, c'est **\u00e9chec et mat** et la partie est finie. Le camp qui donne mat gagne.", "Gibt es keine M\u00f6glichkeit, dem Schach zu entkommen, ist es **Schachmatt** und die Partie ist vorbei. Wer mattsetzt, gewinnt.", "Se n\u00e3o h\u00e1 forma de escapar ao xeque, \u00e9 **xeque-mate** e a partida acaba. Ganha o lado que d\u00e1 mate.", "Se non c'\u00e8 modo di sfuggire allo scacco, \u00e8 **scacco matto** e la partita finisce. Vince chi d\u00e0 matto."], "Stalemate": ["Ahogado", "Le pat", "Patt", "Afogamento", "Stallo"], "If the side to move is **not** in check but has no legal move, the game is a **draw** by stalemate. Beware: it is the most common way to throw away a won game! In this picture, Black has no legal move and is not in check.": ["Si al bando que mueve **no** le dan jaque pero no tiene jugada legal, la partida es **tablas** por ahogado. Cuidado: es la forma m\u00e1s com\u00fan de tirar por la borda una partida ganada. En esta imagen, las negras no tienen jugada legal y no est\u00e1n en jaque.", "Si le camp au trait n'est **pas** en \u00e9chec mais n'a aucun coup l\u00e9gal, la partie est **nulle** par pat. Attention : c'est la fa\u00e7on la plus courante de g\u00e2cher une partie gagn\u00e9e. Sur cette image, les Noirs n'ont aucun coup l\u00e9gal et ne sont pas en \u00e9chec.", "Steht die Seite am Zug **nicht** im Schach, hat aber keinen legalen Zug, endet die Partie **remis** durch Patt. Vorsicht: So wird am h\u00e4ufigsten eine gewonnene Partie verschenkt! In diesem Bild hat Schwarz keinen legalen Zug und steht nicht im Schach.", "Se o lado a jogar **n\u00e3o** est\u00e1 em xeque mas n\u00e3o tem jogada legal, a partida \u00e9 **empate** por afogamento. Cuidado: \u00e9 a forma mais comum de deitar fora uma partida ganha! Nesta imagem, as pretas n\u00e3o t\u00eam jogada legal e n\u00e3o est\u00e3o em xeque.", "Se il lato al tratto **non** \u00e8 sotto scacco ma non ha mosse legali, la partita \u00e8 **patta** per stallo. Attenzione: \u00e8 il modo pi\u00f9 comune di buttare via una partita vinta! In questa immagine il Nero non ha mosse legali e non \u00e8 sotto scacco."], "White to move. Checkmate \u2014 but do NOT stalemate! (Qc7 would be stalemate.)": ["Juegan blancas. Jaque mate, \u00a1pero NO ahogado! (Qc7 ser\u00eda ahogado.)", "Les Blancs jouent. \u00c9chec et mat, mais PAS pat ! (Qc7 serait pat.)", "Wei\u00df am Zug. Schachmatt \u2013 aber NICHT Patt! (Qc7 w\u00e4re Patt.)", "Jogam as brancas. Xeque-mate \u2014 mas N\u00c3O afogamento! (Qc7 seria afogamento.)", "Muove il Bianco. Scacco matto, ma NON stallo! (Qc7 sarebbe stallo.)"], "Put the queen on the back rank.": ["Pon la dama en la primera fila.", "Placez la dame sur la derni\u00e8re rang\u00e9e.", "Stelle die Dame auf die Grundreihe.", "Ponha a dama na primeira fileira.", "Metti la donna sull'ultima traversa."], "Qc8# attacks a8 and b8; the king covers a7 and b7 for you. Always check that the opponent still has a legal move before you play a quiet-looking \"attack\".": ["Qc8# ataca a8 y b8; el rey cubre a7 y b7 por ti. Comprueba siempre que el rival a\u00fan tenga una jugada legal antes de hacer un \u00abataque\u00bb de apariencia tranquila.", "Qc8# attaque a8 et b8 ; le roi couvre a7 et b7 pour vous. V\u00e9rifiez toujours que l'adversaire a encore un coup l\u00e9gal avant de jouer une \u00ab attaque \u00bb d'apparence tranquille.", "Qc8# greift a8 und b8 an; der K\u00f6nig deckt a7 und b7 f\u00fcr dich. Pr\u00fcfe immer, ob der Gegner noch einen legalen Zug hat, bevor du einen harmlos wirkenden \u201eAngriff\u201c spielst.", "Qc8# ataca a8 e b8; o rei cobre a7 e b7 por si. Verifique sempre que o advers\u00e1rio ainda tem uma jogada legal antes de jogar um \u00abataque\u00bb de aspeto tranquilo.", "Qc8# attacca a8 e b8; il re copre a7 e b7 al posto tuo. Controlla sempre che l'avversario abbia ancora una mossa legale prima di giocare un \u00abattacco\u00bb dall'aria tranquilla."], "Find checkmate in one.": ["Encuentra mate en uno.", "Trouvez le mat en un coup.", "Finde Matt in einem Zug.", "Encontre o mate em um.", "Trova il matto in uno."], "Rh8# \u2014 rook gives check along the 8th rank and the white king takes away a7 and b7.": ["Rh8# \u2014 la torre da jaque por la octava fila y el rey blanco quita a7 y b7.", "Rh8# : la tour donne \u00e9chec sur la huiti\u00e8me rang\u00e9e et le roi blanc enl\u00e8ve a7 et b7.", "Rh8# \u2013 der Turm gibt Schach auf der 8. Reihe und der wei\u00dfe K\u00f6nig nimmt a7 und b7.", "Rh8# \u2014 a torre d\u00e1 xeque na oitava fileira e o rei branco tira a7 e b7.", "Rh8# \u2014 la torre d\u00e0 scacco sull'ottava traversa e il re bianco toglie a7 e b7."], "Two moves in one": ["Dos jugadas en una", "Deux coups en un", "Zwei Z\u00fcge in einem", "Duas jogadas numa", "Due mosse in una"], "Castling moves the king two squares toward a rook and the rook jumps to the other side of the king. You may castle only if: neither piece has moved, no pieces stand between them, the king is not in check, and does not pass through or land on an attacked square.": ["El enroque mueve el rey dos casillas hacia una torre y la torre salta al otro lado del rey. Solo puedes enrocar si: ninguna de las dos piezas se ha movido, no hay piezas entre ellas, el rey no est\u00e1 en jaque y no pasa ni cae en una casilla atacada.", "Le roque d\u00e9place le roi de deux cases vers une tour, et la tour saute de l'autre c\u00f4t\u00e9 du roi. On ne peut roquer que si : aucune des deux pi\u00e8ces n'a boug\u00e9, il n'y a rien entre elles, le roi n'est pas en \u00e9chec et ne traverse ni n'arrive sur une case attaqu\u00e9e.", "Die Rochade bewegt den K\u00f6nig zwei Felder zu einem Turm, und der Turm springt auf die andere Seite des K\u00f6nigs. Du darfst nur rochieren, wenn: keine der beiden Figuren gezogen hat, nichts dazwischen steht, der K\u00f6nig nicht im Schach steht und kein angegriffenes Feld \u00fcberquert oder betritt.", "O roque move o rei duas casas em dire\u00e7\u00e3o a uma torre e a torre salta para o outro lado do rei. S\u00f3 se pode rocar se: nenhuma das pe\u00e7as se moveu, n\u00e3o h\u00e1 pe\u00e7as entre elas, o rei n\u00e3o est\u00e1 em xeque e n\u00e3o passa nem cai numa casa atacada.", "L'arrocco sposta il re di due case verso una torre e la torre salta dall'altra parte del re. Si pu\u00f2 arroccare solo se: nessuno dei due pezzi si \u00e8 mosso, non ci sono pezzi in mezzo, il re non \u00e8 sotto scacco e non attraversa n\u00e9 arriva su una casa attaccata."], "Castle kingside (short castling).": ["Enroca corto.", "Roquez c\u00f4t\u00e9 roi (petit roque).", "Rochiere kurz.", "Fa\u00e7a o roque curto.", "Arrocca corto."], "Move your king two squares toward the h1 rook.": ["Mueve tu rey dos casillas hacia la torre de h1.", "D\u00e9placez votre roi de deux cases vers la tour h1.", "Ziehe deinen K\u00f6nig zwei Felder in Richtung des h1-Turms.", "Mova o seu rei duas casas em dire\u00e7\u00e3o \u00e0 torre de h1.", "Sposta il re di due case verso la torre in h1."], "Castling short gets your king behind the pawns and brings the rook to the centre. Do it early!": ["El enroque corto pone al rey tras los peones y lleva la torre al centro. \u00a1Hazlo pronto!", "Le petit roque met votre roi derri\u00e8re les pions et am\u00e8ne la tour au centre. Faites-le t\u00f4t !", "Die kurze Rochade bringt den K\u00f6nig hinter die Bauern und den Turm ins Zentrum. Mach sie fr\u00fch!", "O roque curto p\u00f5e o rei atr\u00e1s dos pe\u00f5es e leva a torre para o centro. Fa\u00e7a-o cedo!", "L'arrocco corto mette il re dietro i pedoni e porta la torre al centro. Fallo presto!"], "En passant": ["Captura al paso", "La prise en passant", "En passant", "En passant", "En passant"], "If a pawn moves two squares and lands beside an enemy pawn, that enemy pawn may capture it \"in passing\" \u2014 as if it had moved just one square. You must do it immediately or lose the right.": ["Si un pe\u00f3n avanza dos casillas y queda junto a un pe\u00f3n enemigo, ese pe\u00f3n puede capturarlo \u00abal paso\u00bb, como si hubiera avanzado solo una casilla. Debes hacerlo de inmediato o pierdes el derecho.", "Si un pion avance de deux cases et se retrouve \u00e0 c\u00f4t\u00e9 d'un pion adverse, celui-ci peut le prendre \u00ab en passant \u00bb, comme s'il n'avait avanc\u00e9 que d'une case. Il faut le faire aussit\u00f4t, sinon le droit est perdu.", "Zieht ein Bauer zwei Felder und landet neben einem gegnerischen Bauern, darf dieser ihn \u201eim Vorbeigehen\u201c schlagen \u2013 als h\u00e4tte er nur ein Feld gezogen. Du musst es sofort tun, sonst verf\u00e4llt das Recht.", "Se um pe\u00e3o avan\u00e7a duas casas e fica ao lado de um pe\u00e3o inimigo, esse pe\u00e3o pode captur\u00e1-lo \u00abde passagem\u00bb \u2014 como se tivesse avan\u00e7ado s\u00f3 uma casa. Tem de o fazer logo ou perde o direito.", "Se un pedone avanza di due case e si ferma accanto a un pedone avversario, questo pu\u00f2 catturarlo \u00abal passaggio\u00bb, come se avesse mosso di una sola casa. Va fatto subito, altrimenti si perde il diritto."], "Black has just played ...f7-f5. Capture it en passant.": ["Las negras acaban de jugar ...f7-f5. Captura al paso.", "Les Noirs viennent de jouer ...f7-f5. Prenez en passant.", "Schwarz hat gerade ...f7-f5 gespielt. Schlage en passant.", "As pretas acabaram de jogar ...f7-f5. Capture en passant.", "Il Nero ha appena giocato ...f7-f5. Cattura en passant."], "Your e5 pawn captures onto f6, the square the pawn skipped.": ["Tu pe\u00f3n de e5 captura en f6, la casilla que el pe\u00f3n salt\u00f3.", "Votre pion e5 prend en f6, la case que le pion a saut\u00e9e.", "Dein e5-Bauer schl\u00e4gt nach f6, auf das Feld, das der Bauer \u00fcbersprungen hat.", "O seu pe\u00e3o de e5 captura em f6, a casa que o pe\u00e3o saltou.", "Il tuo pedone in e5 cattura in f6, la casa che il pedone ha saltato."], "exf6 e.p. removes the f5 pawn even though it is not on f6.": ["exf6 al paso elimina el pe\u00f3n de f5 aunque no est\u00e9 en f6.", "exf6 e.p. enl\u00e8ve le pion f5 bien qu'il ne soit pas en f6.", "exf6 e.p. entfernt den f5-Bauern, obwohl er nicht auf f6 steht.", "exf6 e.p. retira o pe\u00e3o de f5 mesmo n\u00e3o estando em f6.", "exf6 e.p. toglie il pedone in f5 anche se non \u00e8 in f6."], "Promotion": ["Promoci\u00f3n", "La promotion", "Umwandlung", "Promo\u00e7\u00e3o", "Promozione"], "A pawn that reaches the far rank must become a queen, rook, bishop or knight. Nearly always you choose the queen.": ["Un pe\u00f3n que llega a la \u00faltima fila debe convertirse en dama, torre, alfil o caballo. Casi siempre eliges la dama.", "Un pion qui atteint la derni\u00e8re rang\u00e9e doit devenir dame, tour, fou ou cavalier. Presque toujours, on choisit la dame.", "Ein Bauer, der die letzte Reihe erreicht, muss sich in Dame, Turm, L\u00e4ufer oder Springer verwandeln. Fast immer w\u00e4hlst du die Dame.", "Um pe\u00e3o que chega \u00e0 \u00faltima fileira tem de se tornar dama, torre, bispo ou cavalo. Quase sempre escolhe-se a dama.", "Un pedone che raggiunge l'ultima traversa deve diventare donna, torre, alfiere o cavallo. Quasi sempre si sceglie la donna."], "Promote the pawn to a queen.": ["Promociona el pe\u00f3n a dama.", "Promouvez le pion en dame.", "Wandle den Bauern in eine Dame um.", "Promova o pe\u00e3o a dama.", "Promuovi il pedone a donna."], "Move to e8 and choose a queen.": ["Ve a e8 y elige dama.", "Allez en e8 et choisissez une dame.", "Ziehe nach e8 und w\u00e4hle eine Dame.", "V\u00e1 para e8 e escolha uma dama.", "Vai in e8 e scegli una donna."], "e8=Q+ gives check and a second queen.": ["e8=Q+ da jaque y una segunda dama.", "e8=Q+ donne \u00e9chec et une seconde dame.", "e8=Q+ gibt Schach und eine zweite Dame.", "e8=Q+ d\u00e1 xeque e uma segunda dama.", "e8=Q+ d\u00e0 scacco e una seconda donna."], "Counting material": ["Contar el material", "Compter le mat\u00e9riel", "Material z\u00e4hlen", "Contar o material", "Contare il materiale"], "Pawn = 1, knight = 3, bishop = 3, rook = 5, queen = 9. These are guidelines: a trade is good when you receive more value than you give. Two minor pieces for a rook and pawn is roughly equal.": ["Pe\u00f3n = 1, caballo = 3, alfil = 3, torre = 5, dama = 9. Son orientaciones: un cambio es bueno cuando recibes m\u00e1s valor del que das. Dos piezas menores por una torre y un pe\u00f3n es m\u00e1s o menos igual.", "Pion = 1, cavalier = 3, fou = 3, tour = 5, dame = 9. Ce sont des rep\u00e8res : un \u00e9change est bon quand vous recevez plus de valeur que vous n'en donnez. Deux pi\u00e8ces mineures contre une tour et un pion, c'est \u00e0 peu pr\u00e8s \u00e9gal.", "Bauer = 1, Springer = 3, L\u00e4ufer = 3, Turm = 5, Dame = 9. Das sind Richtwerte: Ein Tausch ist gut, wenn du mehr Wert bekommst, als du gibst. Zwei Leichtfiguren f\u00fcr Turm und Bauer sind ungef\u00e4hr gleich.", "Pe\u00e3o = 1, cavalo = 3, bispo = 3, torre = 5, dama = 9. S\u00e3o orienta\u00e7\u00f5es: uma troca \u00e9 boa quando recebe mais valor do que d\u00e1. Duas pe\u00e7as menores por uma torre e um pe\u00e3o \u00e9 mais ou menos igual.", "Pedone = 1, cavallo = 3, alfiere = 3, torre = 5, donna = 9. Sono indicazioni: uno scambio \u00e8 buono quando ricevi pi\u00f9 valore di quanto dai. Due pezzi minori per una torre e un pedone \u00e8 pi\u00f9 o meno pari."], "You can capture a bishop with your rook, but the bishop is protected by a pawn. What happens?": ["Puedes capturar un alfil con tu torre, pero el alfil est\u00e1 protegido por un pe\u00f3n. \u00bfQu\u00e9 pasa?", "Vous pouvez prendre un fou avec votre tour, mais le fou est prot\u00e9g\u00e9 par un pion. Que se passe-t-il ?", "Du kannst einen L\u00e4ufer mit dem Turm schlagen, aber der L\u00e4ufer wird von einem Bauern gedeckt. Was passiert?", "Pode capturar um bispo com a torre, mas o bispo est\u00e1 protegido por um pe\u00e3o. O que acontece?", "Puoi catturare un alfiere con la torre, ma l'alfiere \u00e8 protetto da un pedone. Cosa succede?"], "Rook (5) for bishop (3) loses two points of material, unless there is a bigger tactical gain.": ["Torre (5) por alfil (3) pierde dos puntos de material, salvo que haya una ganancia t\u00e1ctica mayor.", "Tour (5) contre fou (3) perd deux points de mat\u00e9riel, sauf gain tactique plus important.", "Turm (5) f\u00fcr L\u00e4ufer (3) verliert zwei Punkte Material, au\u00dfer es gibt einen gr\u00f6\u00dferen taktischen Gewinn.", "Torre (5) por bispo (3) perde dois pontos de material, a menos que haja um ganho t\u00e1tico maior.", "Torre (5) per alfiere (3) perde due punti di materiale, salvo un guadagno tattico maggiore."], "Which trade favours you?": ["\u00bfQu\u00e9 cambio te favorece?", "Quel \u00e9change vous avantage ?", "Welcher Tausch ist f\u00fcr dich g\u00fcnstig?", "Que troca o favorece?", "Quale scambio ti favorisce?"], "Knight (3) for a rook (5) wins the \"exchange\" \u2014 two points.": ["Caballo (3) por torre (5) gana la \u00abcalidad\u00bb: dos puntos.", "Cavalier (3) contre tour (5) gagne la \u00ab qualit\u00e9 \u00bb : deux points.", "Springer (3) f\u00fcr einen Turm (5) gewinnt die \u201eQualit\u00e4t\u201c \u2013 zwei Punkte.", "Cavalo (3) por torre (5) ganha a \u00abqualidade\u00bb \u2014 dois pontos.", "Cavallo (3) per torre (5) vince la \u00abqualit\u00e0\u00bb: due punti."], "Loose pieces drop off": ["Las piezas sueltas caen", "Les pi\u00e8ces non prot\u00e9g\u00e9es tombent", "Ungedeckte Figuren fallen", "Pe\u00e7as soltas caem", "I pezzi indifesi cadono"], "Before every move ask: \"What is attacked? What is undefended?\" Most games below 1000 are decided by a piece being left hanging.": ["Antes de cada jugada preg\u00fantate: \u00ab\u00bfQu\u00e9 est\u00e1 atacado? \u00bfQu\u00e9 est\u00e1 sin defensa?\u00bb La mayor\u00eda de las partidas por debajo de 1000 se deciden por una pieza dejada colgando.", "Avant chaque coup, demandez-vous : \u00ab Qu'est-ce qui est attaqu\u00e9 ? Qu'est-ce qui n'est pas d\u00e9fendu ? \u00bb La plupart des parties sous 1000 se d\u00e9cident par une pi\u00e8ce laiss\u00e9e en prise.", "Frage dich vor jedem Zug: \u201eWas wird angegriffen? Was ist ungedeckt?\u201c Die meisten Partien unter 1000 werden durch eine eingestellte Figur entschieden.", "Antes de cada jogada pergunte: \u00abO que est\u00e1 atacado? O que est\u00e1 sem defesa?\u00bb A maioria das partidas abaixo de 1000 decide-se por uma pe\u00e7a deixada em prise.", "Prima di ogni mossa chiediti: \u00abCosa \u00e8 attaccato? Cosa \u00e8 indifeso?\u00bb La maggior parte delle partite sotto i 1000 si decide per un pezzo lasciato in presa."], "Black's queen has just taken a pawn on h4. Punish it.": ["La dama negra acaba de capturar un pe\u00f3n en h4. Cast\u00edgala.", "La dame noire vient de prendre un pion en h4. Punissez-la.", "Schwarz' Dame hat gerade einen Bauern auf h4 geschlagen. Bestrafe das.", "A dama preta acabou de capturar um pe\u00e3o em h4. Castigue-a.", "La donna nera ha appena preso un pedone in h4. Puniscila."], "Something attacks h4 already.": ["Algo ya ataca h4.", "Quelque chose attaque d\u00e9j\u00e0 h4.", "Etwas greift h4 schon an.", "Algo j\u00e1 ataca h4.", "Qualcosa attacca gi\u00e0 h4."], "Nxh4 wins the queen for nothing \u2014 the queen went out too early and wasn't protected.": ["Nxh4 gana la dama gratis: sali\u00f3 demasiado pronto y no estaba protegida.", "Nxh4 gagne la dame pour rien : elle est sortie trop t\u00f4t et n'\u00e9tait pas prot\u00e9g\u00e9e.", "Nxh4 gewinnt die Dame umsonst \u2013 sie kam zu fr\u00fch heraus und war ungedeckt.", "Nxh4 ganha a dama de gra\u00e7a \u2014 saiu cedo demais e n\u00e3o estava protegida.", "Nxh4 vince la donna gratis: \u00e8 uscita troppo presto e non era protetta."], "Double attack": ["Doble ataque", "Double attaque", "Doppelangriff", "Ataque duplo", "Doppio attacco"], "A **fork** is a single move that attacks two or more enemy pieces at once. Knights are the best forkers because most pieces cannot attack them back; pawns and queens fork too.": ["Una **horquilla** es una jugada que ataca dos o m\u00e1s piezas enemigas a la vez. Los caballos son los mejores para esto porque casi ninguna pieza puede atacarlos de vuelta; los peones y las damas tambi\u00e9n hacen horquillas.", "Une **fourchette** est un coup qui attaque deux pi\u00e8ces adverses ou plus \u00e0 la fois. Les cavaliers sont les meilleurs pour cela car presque aucune pi\u00e8ce ne peut les attaquer en retour ; les pions et les dames font aussi des fourchettes.", "Eine **Gabel** ist ein Zug, der zwei oder mehr gegnerische Figuren gleichzeitig angreift. Springer sind die besten Gabler, da die meisten Figuren sie nicht zur\u00fcckangreifen k\u00f6nnen; auch Bauern und Damen gabeln.", "Um **garfo** \u00e9 uma jogada que ataca duas ou mais pe\u00e7as inimigas ao mesmo tempo. Os cavalos s\u00e3o os melhores a garfar porque quase nenhuma pe\u00e7a os pode atacar de volta; pe\u00f5es e damas tamb\u00e9m fazem garfos.", "Una **forchetta** \u00e8 una mossa che attacca due o pi\u00f9 pezzi avversari insieme. I cavalli sono i migliori a forchettare perch\u00e9 quasi nessun pezzo pu\u00f2 attaccarli di rimando; anche pedoni e donne fanno forchette."], "Find the knight fork.": ["Encuentra la horquilla de caballo.", "Trouvez la fourchette de cavalier.", "Finde die Springergabel.", "Encontre o garfo de cavalo.", "Trova la forchetta di cavallo."], "A \"royal fork\" attacks the king and a rook together.": ["Una \u00abhorquilla real\u00bb ataca al rey y a una torre a la vez.", "Une \u00ab fourchette royale \u00bb attaque le roi et une tour en m\u00eame temps.", "Eine \u201eK\u00f6nigsgabel\u201c greift K\u00f6nig und Turm zugleich an.", "Um \u00abgarfo real\u00bb ataca o rei e uma torre em conjunto.", "Una \u00abforchetta reale\u00bb attacca re e torre insieme."], "Nc7+ attacks the king on e8 and the rook on a8. The king must move, then you win the rook.": ["Nc7+ ataca al rey de e8 y a la torre de a8. El rey debe moverse y luego ganas la torre.", "Nc7+ attaque le roi en e8 et la tour en a8. Le roi doit bouger, puis vous gagnez la tour.", "Nc7+ greift den K\u00f6nig auf e8 und den Turm auf a8 an. Der K\u00f6nig muss ziehen, dann gewinnst du den Turm.", "Nc7+ ataca o rei em e8 e a torre em a8. O rei tem de se mover e depois ganha a torre.", "Nc7+ attacca il re in e8 e la torre in a8. Il re deve muoversi, poi vinci la torre."], "Absolute and relative pins": ["Clavadas absolutas y relativas", "Clouages absolus et relatifs", "Absolute und relative Fesselungen", "Cravadas absolutas e relativas", "Inchiodature assolute e relative"], "A piece is **pinned** when moving it would expose a more valuable piece behind it. If the piece behind is the king, the pin is **absolute** \u2014 the pinned piece cannot legally move at all.": ["Una pieza est\u00e1 **clavada** cuando moverla expondr\u00eda una pieza m\u00e1s valiosa detr\u00e1s. Si la pieza de detr\u00e1s es el rey, la clavada es **absoluta**: la pieza clavada no puede moverse legalmente.", "Une pi\u00e8ce est **clou\u00e9e** quand la d\u00e9placer exposerait une pi\u00e8ce plus pr\u00e9cieuse derri\u00e8re elle. Si la pi\u00e8ce derri\u00e8re est le roi, le clouage est **absolu** : la pi\u00e8ce clou\u00e9e ne peut l\u00e9galement pas bouger.", "Eine Figur ist **gefesselt**, wenn ihr Zug eine wertvollere Figur dahinter preisg\u00e4be. Ist die dahinterstehende Figur der K\u00f6nig, ist die Fesselung **absolut** \u2013 die gefesselte Figur darf \u00fcberhaupt nicht ziehen.", "Uma pe\u00e7a est\u00e1 **cravada** quando mov\u00ea-la exporia uma pe\u00e7a mais valiosa atr\u00e1s dela. Se a pe\u00e7a de tr\u00e1s \u00e9 o rei, a cravada \u00e9 **absoluta** \u2014 a pe\u00e7a cravada n\u00e3o pode mover-se legalmente.", "Un pezzo \u00e8 **inchiodato** quando muoverlo esporrebbe un pezzo pi\u00f9 prezioso dietro di lui. Se il pezzo dietro \u00e8 il re, l'inchiodatura \u00e8 **assoluta**: il pezzo inchiodato non pu\u00f2 muoversi legalmente."], "Black's queen is pinned to its king. Win it.": ["La dama negra est\u00e1 clavada a su rey. G\u00e1nala.", "La dame noire est clou\u00e9e \u00e0 son roi. Gagnez-la.", "Die schwarze Dame ist an ihren K\u00f6nig gefesselt. Gewinne sie.", "A dama preta est\u00e1 cravada ao seu rei. Ganhe-a.", "La donna nera \u00e8 inchiodata al suo re. Vincila."], "The rook already attacks the queen.": ["La torre ya ataca a la dama.", "La tour attaque d\u00e9j\u00e0 la dame.", "Der Turm greift die Dame bereits an.", "A torre j\u00e1 ataca a dama.", "La torre attacca gi\u00e0 la donna."], "Rxe7+ Kxe7 \u2014 you gave up a rook (5) for a queen (9). The queen could not escape because moving it would put its own king in check.": ["Rxe7+ Kxe7: diste una torre (5) por una dama (9). La dama no pudo escapar porque moverla dejar\u00eda a su propio rey en jaque.", "Rxe7+ Kxe7 : vous avez donn\u00e9 une tour (5) contre une dame (9). La dame ne pouvait pas s'\u00e9chapper car la d\u00e9placer mettrait son propre roi en \u00e9chec.", "Rxe7+ Kxe7 \u2013 du gabst einen Turm (5) f\u00fcr eine Dame (9). Die Dame konnte nicht entkommen, da ihr Zug den eigenen K\u00f6nig ins Schach gestellt h\u00e4tte.", "Rxe7+ Kxe7 \u2014 deu uma torre (5) por uma dama (9). A dama n\u00e3o p\u00f4de escapar porque mov\u00ea-la poria o pr\u00f3prio rei em xeque.", "Rxe7+ Kxe7 \u2014 hai dato una torre (5) per una donna (9). La donna non poteva scappare perch\u00e9 muoverla avrebbe messo il suo re sotto scacco."], "Reverse pin": ["Clavada inversa", "Clouage invers\u00e9", "Umgekehrte Fesselung", "Cravada inversa", "Inchiodatura inversa"], "In a **skewer** you attack a valuable piece that has to move, exposing a less valuable (or equal) piece behind it, which you then capture.": ["En un **ataque en rayos X** atacas una pieza valiosa que tiene que moverse, dejando expuesta otra menos valiosa (o igual) detr\u00e1s, que entonces capturas.", "Dans une **enfilade**, vous attaquez une pi\u00e8ce de valeur qui doit bouger, exposant derri\u00e8re elle une pi\u00e8ce de moindre valeur (ou \u00e9gale) que vous capturez ensuite.", "Bei einem **Spie\u00df** greifst du eine wertvolle Figur an, die ziehen muss, wodurch eine weniger wertvolle (oder gleichwertige) dahinter frei wird, die du dann schl\u00e4gst.", "Num **espeto** ataca uma pe\u00e7a valiosa que tem de se mover, expondo uma pe\u00e7a menos valiosa (ou igual) atr\u00e1s, que depois captura.", "In un **infilzamento** attacchi un pezzo di valore che deve spostarsi, esponendo dietro di lui un pezzo meno prezioso (o pari), che poi catturi."], "Skewer the king and the queen.": ["Ataca al rey y a la dama en rayos X.", "Enfilez le roi et la dame.", "Spie\u00dfe K\u00f6nig und Dame.", "Espete o rei e a dama.", "Infilza il re e la donna."], "Check along the 8th rank.": ["Jaque por la octava fila.", "\u00c9chec sur la huiti\u00e8me rang\u00e9e.", "Schach auf der 8. Reihe.", "Xeque pela oitava fileira.", "Scacco sull'ottava traversa."], "Rh8+ forces the king off the rank and then Rxa8 wins the queen.": ["Rh8+ obliga al rey a salir de la fila y luego Rxa8 gana la dama.", "Rh8+ force le roi \u00e0 quitter la rang\u00e9e, puis Rxa8 gagne la dame.", "Rh8+ zwingt den K\u00f6nig von der Reihe, dann gewinnt Rxa8 die Dame.", "Rh8+ for\u00e7a o rei a sair da fileira e depois Rxa8 ganha a dama.", "Rh8+ costringe il re a lasciare la traversa e poi Rxa8 vince la donna."], "Open the line": ["Abre la l\u00ednea", "Ouvrir la ligne", "\u00d6ffne die Linie", "Abra a linha", "Apri la linea"], "A **discovered attack** happens when you move a piece out of the way and reveal an attack from a piece behind it. If the revealed piece gives check, it is a *discovered check* \u2014 and the moving piece can do anything it likes.": ["Un **ataque descubierto** ocurre cuando mueves una pieza y dejas al descubierto el ataque de otra pieza detr\u00e1s. Si la pieza descubierta da jaque, es un *jaque descubierto*, y la pieza que se mueve puede hacer lo que quiera.", "Une **attaque \u00e0 la d\u00e9couverte** se produit quand vous \u00e9cartez une pi\u00e8ce et r\u00e9v\u00e9lez l'attaque d'une pi\u00e8ce plac\u00e9e derri\u00e8re. Si la pi\u00e8ce d\u00e9voil\u00e9e donne \u00e9chec, c'est un *\u00e9chec \u00e0 la d\u00e9couverte* : la pi\u00e8ce qui bouge peut alors faire ce qu'elle veut.", "Ein **Abzugsangriff** entsteht, wenn du eine Figur aus dem Weg ziehst und den Angriff einer dahinterstehenden Figur freigibst. Gibt die freigelegte Figur Schach, ist es ein *Abzugsschach* \u2013 und die ziehende Figur kann tun, was sie will.", "Um **ataque descoberto** acontece quando move uma pe\u00e7a do caminho e revela o ataque de uma pe\u00e7a atr\u00e1s. Se a pe\u00e7a revelada d\u00e1 xeque, \u00e9 um *xeque descoberto* \u2014 e a pe\u00e7a que se move pode fazer o que quiser.", "Un **attacco di scoperta** avviene quando sposti un pezzo dal cammino e riveli l'attacco di un pezzo dietro. Se il pezzo scoperto d\u00e0 scacco, \u00e8 uno *scacco di scoperta* \u2014 e il pezzo che si muove pu\u00f2 fare ci\u00f2 che vuole."], "Win the queen with a discovered check.": ["Gana la dama con un jaque descubierto.", "Gagnez la dame avec un \u00e9chec \u00e0 la d\u00e9couverte.", "Gewinne die Dame mit einem Abzugsschach.", "Ganhe a dama com um xeque descoberto.", "Vinci la donna con uno scacco di scoperta."], "The bishop can capture something while uncovering the rook.": ["El alfil puede capturar algo mientras descubre la torre.", "Le fou peut prendre quelque chose en d\u00e9voilant la tour.", "Der L\u00e4ufer kann etwas schlagen und dabei den Turm freilegen.", "O bispo pode capturar algo enquanto descobre a torre.", "L'alfiere pu\u00f2 catturare qualcosa scoprendo la torre."], "Bxa8+ takes the queen and uncovers Re1's check. Black has no time to recapture.": ["Bxa8+ toma la dama y descubre el jaque de Re1. Las negras no tienen tiempo de recapturar.", "Bxa8+ prend la dame et d\u00e9voile l'\u00e9chec de Re1. Les Noirs n'ont pas le temps de reprendre.", "Bxa8+ schl\u00e4gt die Dame und legt das Schach von Re1 frei. Schwarz hat keine Zeit zum Zur\u00fcckschlagen.", "Bxa8+ toma a dama e descobre o xeque de Re1. As pretas n\u00e3o t\u00eam tempo para recapturar.", "Bxa8+ prende la donna e scopre lo scacco di Re1. Il Nero non ha tempo di riprendere."], "Pawns in the way": ["Peones en el camino", "Des pions g\u00eanants", "Bauern im Weg", "Pe\u00f5es no caminho", "Pedoni di mezzo"], "A king on the back rank boxed in by its own pawns can be mated by a rook or queen. Give your king \"luft\" (a flight square) with h3 or h6 to avoid it, and look for the pattern against the opponent.": ["Un rey en la primera fila encerrado por sus propios peones puede recibir mate de torre o dama. Dale a tu rey una \u00abluft\u00bb (casilla de fuga) con h3 o h6 para evitarlo, y busca el patr\u00f3n contra el rival.", "Un roi sur la derni\u00e8re rang\u00e9e, enferm\u00e9 par ses propres pions, peut \u00eatre mat\u00e9 par une tour ou une dame. Donnez de l'air (\u00ab luft \u00bb) \u00e0 votre roi avec h3 ou h6 pour l'\u00e9viter, et cherchez ce sch\u00e9ma contre l'adversaire.", "Ein K\u00f6nig auf der Grundreihe, von eigenen Bauern eingesperrt, kann von Turm oder Dame mattgesetzt werden. Gib deinem K\u00f6nig mit h3 oder h6 \u201eLuft\u201c (ein Fluchtfeld), um das zu vermeiden, und suche das Muster beim Gegner.", "Um rei na primeira fileira, encurralado pelos pr\u00f3prios pe\u00f5es, pode levar mate de torre ou dama. D\u00ea ao seu rei \u00abluft\u00bb (uma casa de fuga) com h3 ou h6 para o evitar, e procure o padr\u00e3o contra o advers\u00e1rio.", "Un re sull'ultima traversa, chiuso dai propri pedoni, pu\u00f2 essere matto da una torre o una donna. Dai al tuo re \u00abluft\u00bb (una casa di fuga) con h3 o h6 per evitarlo, e cerca lo schema contro l'avversario."], "Checkmate in one.": ["Jaque mate en uno.", "Mat en un coup.", "Matt in einem Zug.", "Xeque-mate em um.", "Matto in uno."], "Ra8# \u2014 the f7, g7 and h7 pawns take away every flight square.": ["Ra8# \u2014 los peones de f7, g7 y h7 quitan todas las casillas de fuga.", "Ra8# : les pions f7, g7 et h7 retirent toutes les cases de fuite.", "Ra8# \u2013 die Bauern auf f7, g7 und h7 nehmen alle Fluchtfelder.", "Ra8# \u2014 os pe\u00f5es de f7, g7 e h7 tiram todas as casas de fuga.", "Ra8# \u2014 i pedoni f7, g7 e h7 tolgono ogni casa di fuga."], "Boxed in by friends": ["Encerrado por los amigos", "Enferm\u00e9 par ses amis", "Von Freunden eingesperrt", "Encurralado pelos amigos", "Chiuso dagli amici"], "A **smothered mate** is delivered by a knight because it is the only piece that checks from a distance without needing a line. The king's own pieces take away all its squares.": ["Un **mate ahogado** lo da un caballo porque es la \u00fanica pieza que da jaque a distancia sin necesitar una l\u00ednea. Las propias piezas del rey le quitan todas las casillas.", "Un **mat \u00e9touff\u00e9** est donn\u00e9 par un cavalier car c'est la seule pi\u00e8ce qui donne \u00e9chec \u00e0 distance sans avoir besoin d'une ligne. Les propres pi\u00e8ces du roi lui enl\u00e8vent toutes ses cases.", "Ein **Erstickungsmatt** wird vom Springer gegeben, weil er die einzige Figur ist, die aus der Ferne Schach gibt, ohne eine Linie zu brauchen. Die eigenen Figuren des K\u00f6nigs nehmen ihm alle Felder.", "Um **mate sufocado** \u00e9 dado por um cavalo porque \u00e9 a \u00fanica pe\u00e7a que d\u00e1 xeque \u00e0 dist\u00e2ncia sem precisar de uma linha. As pr\u00f3prias pe\u00e7as do rei tiram-lhe todas as casas.", "Un **matto affogato** lo d\u00e0 un cavallo perch\u00e9 \u00e8 l'unico pezzo che d\u00e0 scacco da lontano senza bisogno di una linea. I pezzi del re stesso gli tolgono tutte le case."], "Nf7#. The king on h8 is hemmed in by its own rook and pawns.": ["Nf7#. El rey de h8 est\u00e1 encerrado por su propia torre y sus peones.", "Nf7#. Le roi en h8 est cern\u00e9 par sa propre tour et ses pions.", "Nf7#. Der K\u00f6nig auf h8 ist von eigenem Turm und eigenen Bauern eingeengt.", "Nf7#. O rei em h8 est\u00e1 cercado pela pr\u00f3pria torre e pe\u00f5es.", "Nf7#. Il re in h8 \u00e8 stretto dalla propria torre e dai propri pedoni."], "Rook after rook": ["Torre tras torre", "Tour apr\u00e8s tour", "Turm um Turm", "Torre atr\u00e1s de torre", "Torre dopo torre"], "Two rooks can force mate on their own: one rook cuts off a rank, the other gives check; then the roles swap, rung by rung, until the king is on the edge.": ["Dos torres pueden dar mate por s\u00ed solas: una corta una fila y la otra da jaque; luego se cambian los papeles, escal\u00f3n a escal\u00f3n, hasta que el rey est\u00e1 en el borde.", "Deux tours peuvent forcer le mat seules : une tour coupe une rang\u00e9e, l'autre donne \u00e9chec ; puis les r\u00f4les s'\u00e9changent, barreau apr\u00e8s barreau, jusqu'\u00e0 ce que le roi soit au bord.", "Zwei T\u00fcrme k\u00f6nnen allein mattsetzen: Ein Turm sperrt eine Reihe ab, der andere gibt Schach; dann tauschen sie die Rollen, Sprosse um Sprosse, bis der K\u00f6nig am Rand steht.", "Duas torres conseguem for\u00e7ar o mate sozinhas: uma corta uma fileira, a outra d\u00e1 xeque; depois trocam os pap\u00e9is, degrau a degrau, at\u00e9 o rei estar na borda.", "Due torri possono dare matto da sole: una taglia una traversa, l'altra d\u00e0 scacco; poi si scambiano i ruoli, piolo dopo piolo, finch\u00e9 il re \u00e8 sul bordo."], "Find mate in two.": ["Encuentra mate en dos.", "Trouvez le mat en deux coups.", "Finde Matt in zwei Z\u00fcgen.", "Encontre o mate em dois.", "Trova il matto in due."], "Ra7 (or Rb7) cuts off the seventh rank; after the king shuffles, the other rook mates on the eighth.": ["Ra7 (o Rb7) corta la s\u00e9ptima fila; cuando el rey se mueve, la otra torre da mate en la octava.", "Ra7 (ou Rb7) coupe la septi\u00e8me rang\u00e9e ; apr\u00e8s le d\u00e9placement du roi, l'autre tour mate sur la huiti\u00e8me.", "Ra7 (oder Rb7) sperrt die siebte Reihe ab; nachdem der K\u00f6nig gezogen hat, setzt der andere Turm auf der achten Reihe matt.", "Ra7 (ou Rb7) corta a s\u00e9tima fileira; depois de o rei se mexer, a outra torre d\u00e1 mate na oitava.", "Ra7 (o Rb7) taglia la settima traversa; dopo che il re si \u00e8 mosso, l'altra torre d\u00e0 matto sull'ottava."], "Three goals": ["Tres objetivos", "Trois objectifs", "Drei Ziele", "Tr\u00eas objetivos", "Tre obiettivi"], "1) **Control the centre** with pawns (e4/d4) and pieces. 2) **Develop** knights and bishops before moving anything twice. 3) **Castle** early. Don't bring the queen out early, and don't make unnecessary pawn moves.": ["1) **Controla el centro** con peones (e4/d4) y piezas. 2) **Desarrolla** caballos y alfiles antes de mover nada dos veces. 3) **Enroca** pronto. No saques la dama pronto ni hagas jugadas de pe\u00f3n innecesarias.", "1) **Contr\u00f4lez le centre** avec des pions (e4/d4) et des pi\u00e8ces. 2) **D\u00e9veloppez** cavaliers et fous avant de bouger quoi que ce soit deux fois. 3) **Roquez** t\u00f4t. Ne sortez pas la dame trop t\u00f4t et ne faites pas de coups de pion inutiles.", "1) **Kontrolliere das Zentrum** mit Bauern (e4/d4) und Figuren. 2) **Entwickle** Springer und L\u00e4ufer, bevor du etwas zweimal ziehst. 3) **Rochiere** fr\u00fch. Bring die Dame nicht fr\u00fch heraus und mach keine unn\u00f6tigen Bauernz\u00fcge.", "1) **Controle o centro** com pe\u00f5es (e4/d4) e pe\u00e7as. 2) **Desenvolva** cavalos e bispos antes de mover algo duas vezes. 3) **Fa\u00e7a o roque** cedo. N\u00e3o traga a dama cedo e n\u00e3o fa\u00e7a jogadas de pe\u00e3o desnecess\u00e1rias.", "1) **Controlla il centro** con pedoni (e4/d4) e pezzi. 2) **Sviluppa** cavalli e alfieri prima di muovere qualcosa due volte. 3) **Arrocca** presto. Non portare fuori la donna presto e non fare mosse di pedone inutili."], "After 1.e4 e5 2.Nf3 Nc6 \u2014 which move best follows the principles?": ["Tras 1.e4 e5 2.Nf3 Nc6, \u00bfqu\u00e9 jugada sigue mejor los principios?", "Apr\u00e8s 1.e4 e5 2.Nf3 Nc6, quel coup respecte le mieux les principes ?", "Nach 1.e4 e5 2.Nf3 Nc6 \u2013 welcher Zug folgt den Prinzipien am besten?", "Depois de 1.e4 e5 2.Nf3 Nc6 \u2014 que jogada segue melhor os princ\u00edpios?", "Dopo 1.e4 e5 2.Nf3 Nc6, quale mossa segue meglio i princ\u00ecpi?"], "Bc4 develops, eyes f7 and prepares castling. The others waste time or expose the queen.": ["Bc4 desarrolla, vigila f7 y prepara el enroque. Las otras pierden tiempo o exponen la dama.", "Bc4 d\u00e9veloppe, vise f7 et pr\u00e9pare le roque. Les autres font perdre du temps ou exposent la dame.", "Bc4 entwickelt, zielt auf f7 und bereitet die Rochade vor. Die anderen verschwenden Zeit oder setzen die Dame aus.", "Bc4 desenvolve, vigia f7 e prepara o roque. As outras perdem tempo ou exp\u00f5em a dama.", "Bc4 sviluppa, prende di mira f7 e prepara l'arrocco. Le altre fanno perdere tempo o espongono la donna."], "Why is moving the same piece twice in the opening usually a mistake?": ["\u00bfPor qu\u00e9 suele ser un error mover dos veces la misma pieza en la apertura?", "Pourquoi d\u00e9placer deux fois la m\u00eame pi\u00e8ce en ouverture est-il g\u00e9n\u00e9ralement une erreur ?", "Warum ist es in der Er\u00f6ffnung meist ein Fehler, dieselbe Figur zweimal zu ziehen?", "Porque \u00e9 geralmente um erro mover a mesma pe\u00e7a duas vezes na abertura?", "Perch\u00e9 muovere due volte lo stesso pezzo in apertura di solito \u00e8 un errore?"], "Each tempo spent shuffling is a developing move your opponent gets for free.": ["Cada tempo gastado en mover de un lado a otro es una jugada de desarrollo que el rival recibe gratis.", "Chaque temps perdu \u00e0 d\u00e9placer une pi\u00e8ce est un coup de d\u00e9veloppement offert \u00e0 l'adversaire.", "Jedes Tempo, das du mit Hin-und-her-Ziehen verbrauchst, ist ein Entwicklungszug, den dein Gegner geschenkt bekommt.", "Cada tempo gasto a mexer de um lado para o outro \u00e9 uma jogada de desenvolvimento que o advers\u00e1rio recebe de gra\u00e7a.", "Ogni tempo speso a spostare un pezzo \u00e8 una mossa di sviluppo che l'avversario riceve gratis."], "Central pieces see more": ["Las piezas centrales ven m\u00e1s", "Les pi\u00e8ces centrales voient plus loin", "Zentrale Figuren sehen mehr", "As pe\u00e7as centrais veem mais", "I pezzi centrali vedono di pi\u00f9"], "Pieces in the centre attack more squares and can switch flanks quickly. Occupy the centre with pawns, then support them with pieces; or control it from a distance with fianchettoed bishops.": ["Las piezas en el centro atacan m\u00e1s casillas y pueden cambiar de flanco r\u00e1pido. Ocupa el centro con peones y ap\u00f3yalos con piezas; o contr\u00f3lalo a distancia con alfiles en fianchetto.", "Les pi\u00e8ces au centre attaquent plus de cases et peuvent changer d'aile rapidement. Occupez le centre avec des pions, puis soutenez-les avec des pi\u00e8ces ; ou contr\u00f4lez-le \u00e0 distance avec des fous en fianchetto.", "Figuren im Zentrum greifen mehr Felder an und k\u00f6nnen schnell den Fl\u00fcgel wechseln. Besetze das Zentrum mit Bauern und st\u00fctze sie mit Figuren; oder kontrolliere es aus der Ferne mit fianchettierten L\u00e4ufern.", "As pe\u00e7as no centro atacam mais casas e mudam de flanco depressa. Ocupe o centro com pe\u00f5es e apoie-os com pe\u00e7as; ou controle-o \u00e0 dist\u00e2ncia com bispos em fianqueto.", "I pezzi al centro attaccano pi\u00f9 case e possono cambiare ala rapidamente. Occupa il centro con i pedoni e sostienili con i pezzi; oppure controllalo da lontano con alfieri in fianchetto."], "A knight on d4 attacks 8 squares; on a1 it attacks 2. What does this teach you?": ["Un caballo en d4 ataca 8 casillas; en a1, 2. \u00bfQu\u00e9 te ense\u00f1a esto?", "Un cavalier en d4 attaque 8 cases ; en a1, 2. Que vous apprend cela ?", "Ein Springer auf d4 greift 8 Felder an, auf a1 nur 2. Was lehrt dich das?", "Um cavalo em d4 ataca 8 casas; em a1, 2. O que lhe ensina isto?", "Un cavallo in d4 attacca 8 case; in a1, 2. Cosa ti insegna?"], "Mobility is power. Put your pieces where they attack the most squares.": ["La movilidad es poder. Coloca tus piezas donde ataquen m\u00e1s casillas.", "La mobilit\u00e9, c'est la puissance. Placez vos pi\u00e8ces l\u00e0 o\u00f9 elles attaquent le plus de cases.", "Beweglichkeit ist Macht. Stelle deine Figuren dorthin, wo sie die meisten Felder angreifen.", "Mobilidade \u00e9 poder. Ponha as suas pe\u00e7as onde atacam mais casas.", "La mobilit\u00e0 \u00e8 potere. Metti i pezzi dove attaccano pi\u00f9 case."], "Pawns never go back": ["Los peones nunca retroceden", "Les pions ne reculent jamais", "Bauern gehen nie zur\u00fcck", "Os pe\u00f5es nunca recuam", "I pedoni non tornano indietro"], "Pawn weaknesses are permanent. **Isolated pawns** have no friendly pawn on adjacent files. **Doubled pawns** are two on the same file. **Backward pawns** cannot be defended by other pawns. A **passed pawn** has no enemy pawn ahead on its file or the adjacent ones \u2014 and passed pawns are strong, especially in the endgame.": ["Las debilidades de peones son permanentes. Los **peones aislados** no tienen pe\u00f3n amigo en las columnas adyacentes. Los **peones doblados** son dos en la misma columna. Los **peones retrasados** no pueden ser defendidos por otros peones. Un **pe\u00f3n pasado** no tiene peones enemigos delante en su columna ni en las adyacentes, y los peones pasados son fuertes, sobre todo en el final.", "Les faiblesses de pions sont permanentes. Les **pions isol\u00e9s** n'ont aucun pion ami sur les colonnes adjacentes. Les **pions doubl\u00e9s** sont deux sur la m\u00eame colonne. Les **pions arri\u00e9r\u00e9s** ne peuvent pas \u00eatre d\u00e9fendus par d'autres pions. Un **pion pass\u00e9** n'a aucun pion adverse devant lui sur sa colonne ni sur les colonnes adjacentes : les pions pass\u00e9s sont forts, surtout en finale.", "Bauernschw\u00e4chen sind dauerhaft. **Isolierte Bauern** haben auf den Nachbarlinien keinen eigenen Bauern. **Doppelbauern** sind zwei auf derselben Linie. **R\u00fcckst\u00e4ndige Bauern** k\u00f6nnen nicht von anderen Bauern gedeckt werden. Ein **Freibauer** hat keinen gegnerischen Bauern vor sich auf seiner oder den Nachbarlinien \u2013 und Freibauern sind stark, besonders im Endspiel.", "As fraquezas de pe\u00f5es s\u00e3o permanentes. **Pe\u00f5es isolados** n\u00e3o t\u00eam pe\u00e3o amigo nas colunas adjacentes. **Pe\u00f5es dobrados** s\u00e3o dois na mesma coluna. **Pe\u00f5es atrasados** n\u00e3o podem ser defendidos por outros pe\u00f5es. Um **pe\u00e3o passado** n\u00e3o tem pe\u00e3o inimigo \u00e0 frente na sua coluna nem nas adjacentes \u2014 e os pe\u00f5es passados s\u00e3o fortes, sobretudo no final.", "Le debolezze dei pedoni sono permanenti. I **pedoni isolati** non hanno pedoni amici sulle colonne adiacenti. I **pedoni doppiati** sono due sulla stessa colonna. I **pedoni arretrati** non possono essere difesi da altri pedoni. Un **pedone passato** non ha pedoni avversari davanti sulla sua colonna n\u00e9 sulle adiacenti \u2014 e i pedoni passati sono forti, soprattutto nel finale."], "In the diagram, which pawn is a passed pawn for White?": ["En el diagrama, \u00bfqu\u00e9 pe\u00f3n es pasado para las blancas?", "Sur le diagramme, quel pion est un pion pass\u00e9 pour les Blancs ?", "Welcher Bauer ist im Diagramm ein Freibauer f\u00fcr Wei\u00df?", "No diagrama, qual pe\u00e3o \u00e9 passado para as brancas?", "Nel diagramma, quale pedone \u00e8 passato per il Bianco?"], "No black pawn on the c-, d- or e-file can stop d5 on its way to d8. A passed pawn must be watched at all times.": ["Ning\u00fan pe\u00f3n negro en las columnas c, d o e puede detener a d5 en su camino a d8. Un pe\u00f3n pasado debe vigilarse siempre.", "Aucun pion noir sur les colonnes c, d ou e ne peut arr\u00eater d5 sur sa route vers d8. Un pion pass\u00e9 doit toujours \u00eatre surveill\u00e9.", "Kein schwarzer Bauer auf der c-, d- oder e-Linie kann d5 auf dem Weg nach d8 aufhalten. Ein Freibauer muss st\u00e4ndig beobachtet werden.", "Nenhum pe\u00e3o preto nas colunas c, d ou e pode parar d5 a caminho de d8. Um pe\u00e3o passado deve ser vigiado sempre.", "Nessun pedone nero sulle colonne c, d o e pu\u00f2 fermare d5 verso d8. Un pedone passato va sempre tenuto d'occhio."], "Shelter first": ["Primero el refugio", "L'abri d'abord", "Zuerst der Schutz", "Primeiro o abrigo", "Prima il riparo"], "After castling, the pawns in front of the king (f, g, h) are his shield. Pushing them loosens the shelter. Attackers love open files and diagonals pointing at the king.": ["Tras enrocar, los peones delante del rey (f, g, h) son su escudo. Avanzarlos debilita el refugio. A los atacantes les encantan las columnas y diagonales abiertas hacia el rey.", "Apr\u00e8s le roque, les pions devant le roi (f, g, h) forment son bouclier. Les pousser affaiblit l'abri. Les attaquants adorent les colonnes et diagonales ouvertes vers le roi.", "Nach der Rochade sind die Bauern vor dem K\u00f6nig (f, g, h) sein Schutzschild. Sie vorzusto\u00dfen lockert den Schutz. Angreifer lieben offene Linien und Diagonalen, die auf den K\u00f6nig zeigen.", "Depois do roque, os pe\u00f5es \u00e0 frente do rei (f, g, h) s\u00e3o o seu escudo. Avan\u00e7\u00e1-los enfraquece o abrigo. Os atacantes adoram colunas e diagonais abertas apontadas ao rei.", "Dopo l'arrocco, i pedoni davanti al re (f, g, h) sono il suo scudo. Spingerli indebolisce il riparo. Agli attaccanti piacciono colonne e diagonali aperte verso il re."], "Your king is castled short with pawns on f2, g2, h2. Which move weakens it most?": ["Tu rey est\u00e1 enrocado corto con peones en f2, g2, h2. \u00bfQu\u00e9 jugada lo debilita m\u00e1s?", "Votre roi a fait le petit roque avec des pions en f2, g2, h2. Quel coup l'affaiblit le plus ?", "Dein K\u00f6nig ist kurz rochiert mit Bauern auf f2, g2, h2. Welcher Zug schw\u00e4cht ihn am meisten?", "O seu rei fez o roque curto com pe\u00f5es em f2, g2, h2. Que jogada o enfraquece mais?", "Il tuo re \u00e8 arroccato corto con pedoni in f2, g2, h2. Quale mossa lo indebolisce di pi\u00f9?"], "g4 opens diagonals and squares around the king. h3 creates luft but is usually fine; a3 is a distant wing move.": ["g4 abre diagonales y casillas alrededor del rey. h3 crea luft pero suele estar bien; a3 es una jugada lejana en el flanco.", "g4 ouvre des diagonales et des cases autour du roi. h3 cr\u00e9e de l'air mais reste g\u00e9n\u00e9ralement correct ; a3 est un coup d'aile \u00e9loign\u00e9.", "g4 \u00f6ffnet Diagonalen und Felder um den K\u00f6nig. h3 schafft Luft, ist aber meist in Ordnung; a3 ist ein weit entfernter Fl\u00fcgelzug.", "g4 abre diagonais e casas \u00e0 volta do rei. h3 cria luft mas costuma ser aceit\u00e1vel; a3 \u00e9 uma jogada de flanco distante.", "g4 apre diagonali e case attorno al re. h3 crea luft ma di solito va bene; a3 \u00e8 una mossa d'ala lontana."], "Outposts": ["Puestos avanzados", "Les avant-postes", "Vorposten", "Postos avan\u00e7ados", "Avamposti"], "An **outpost** is a square deep in enemy territory that cannot be attacked by enemy pawns. A knight on such a square is often stronger than a rook. A bishop is \"good\" when its pawns are on the opposite colour from the bishop.": ["Un **puesto avanzado** es una casilla en territorio enemigo que no puede ser atacada por peones enemigos. Un caballo en esa casilla suele ser m\u00e1s fuerte que una torre. Un alfil es \u00abbueno\u00bb cuando sus peones est\u00e1n en el color opuesto al del alfil.", "Un **avant-poste** est une case profonde en territoire adverse qui ne peut pas \u00eatre attaqu\u00e9e par des pions adverses. Un cavalier sur une telle case vaut souvent mieux qu'une tour. Un fou est \u00ab bon \u00bb quand ses pions sont sur la couleur oppos\u00e9e \u00e0 la sienne.", "Ein **Vorposten** ist ein Feld tief im gegnerischen Gebiet, das nicht von gegnerischen Bauern angegriffen werden kann. Ein Springer auf so einem Feld ist oft st\u00e4rker als ein Turm. Ein L\u00e4ufer ist \u201egut\u201c, wenn seine Bauern auf der anderen Farbe stehen als der L\u00e4ufer.", "Um **posto avan\u00e7ado** \u00e9 uma casa bem dentro do territ\u00f3rio inimigo que n\u00e3o pode ser atacada por pe\u00f5es inimigos. Um cavalo numa casa assim \u00e9 muitas vezes mais forte do que uma torre. Um bispo \u00e9 \u00abbom\u00bb quando os seus pe\u00f5es est\u00e3o na cor oposta \u00e0 do bispo.", "Un **avamposto** \u00e8 una casa in profondit\u00e0 nel campo avversario che non pu\u00f2 essere attaccata da pedoni avversari. Un cavallo su una casa cos\u00ec \u00e8 spesso pi\u00f9 forte di una torre. Un alfiere \u00e8 \u00abbuono\u00bb quando i suoi pedoni sono sul colore opposto a quello dell'alfiere."], "Black has pawns on a7, b7, c6, f7, g7, h7. Why is a white knight on d4 stable?": ["Las negras tienen peones en a7, b7, c6, f7, g7, h7. \u00bfPor qu\u00e9 es estable un caballo blanco en d4?", "Les Noirs ont des pions en a7, b7, c6, f7, g7, h7. Pourquoi un cavalier blanc en d4 est-il stable ?", "Schwarz hat Bauern auf a7, b7, c6, f7, g7, h7. Warum steht ein wei\u00dfer Springer auf d4 stabil?", "As pretas t\u00eam pe\u00f5es em a7, b7, c6, f7, g7, h7. Porque \u00e9 est\u00e1vel um cavalo branco em d4?", "Il Nero ha pedoni in a7, b7, c6, f7, g7, h7. Perch\u00e9 un cavallo bianco in d4 \u00e8 stabile?"], "A pawn on the c- or e-file would attack d4. With those pawns gone (or advanced past), the knight is untouchable by pawns.": ["Un pe\u00f3n en la columna c o e atacar\u00eda d4. Sin esos peones (o ya avanzados), el caballo es intocable por los peones.", "Un pion sur la colonne c ou e attaquerait d4. Ces pions disparus (ou avanc\u00e9s), le cavalier est intouchable par les pions.", "Ein Bauer auf der c- oder e-Linie w\u00fcrde d4 angreifen. Ohne diese Bauern (oder vorbeigezogen) ist der Springer f\u00fcr Bauern unantastbar.", "Um pe\u00e3o na coluna c ou e atacaria d4. Sem esses pe\u00f5es (ou j\u00e1 avan\u00e7ados), o cavalo \u00e9 intoc\u00e1vel por pe\u00f5es.", "Un pedone sulla colonna c o e attaccherebbe d4. Senza quei pedoni (o gi\u00e0 avanzati), il cavallo \u00e8 intoccabile dai pedoni."], "Rooks want lines": ["Las torres quieren l\u00edneas", "Les tours veulent des lignes", "T\u00fcrme wollen Linien", "As torres querem linhas", "Le torri vogliono linee"], "Rooks need open files. Double them (one behind the other) to dominate the file and invade on the 7th rank, where they attack pawns from the side and cage the king.": ["Las torres necesitan columnas abiertas. D\u00f3blalas (una detr\u00e1s de otra) para dominar la columna e invadir la s\u00e9ptima fila, donde atacan peones por el lado y encierran al rey.", "Les tours ont besoin de colonnes ouvertes. Doublez-les (l'une derri\u00e8re l'autre) pour dominer la colonne et envahir la septi\u00e8me rang\u00e9e, o\u00f9 elles attaquent les pions de c\u00f4t\u00e9 et enferment le roi.", "T\u00fcrme brauchen offene Linien. Verdopple sie (einen hinter den anderen), um die Linie zu beherrschen und auf der 7. Reihe einzudringen, wo sie Bauern seitlich angreifen und den K\u00f6nig einsperren.", "As torres precisam de colunas abertas. Duplique-as (uma atr\u00e1s da outra) para dominar a coluna e invadir a s\u00e9tima fileira, onde atacam pe\u00f5es de lado e encurralam o rei.", "Le torri hanno bisogno di colonne aperte. Raddoppiale (una dietro l'altra) per dominare la colonna e invadere la settima traversa, dove attaccano i pedoni di lato e imprigionano il re."], "Place your rook on the open d-file.": ["Coloca tu torre en la columna d abierta.", "Placez votre tour sur la colonne d ouverte.", "Stelle deinen Turm auf die offene d-Linie.", "Ponha a torre na coluna d aberta.", "Metti la torre sulla colonna d aperta."], "Any open file is better than a closed one; the d-file is open.": ["Cualquier columna abierta es mejor que una cerrada; la columna d est\u00e1 abierta.", "Toute colonne ouverte vaut mieux qu'une ferm\u00e9e ; la colonne d est ouverte.", "Jede offene Linie ist besser als eine geschlossene; die d-Linie ist offen.", "Qualquer coluna aberta \u00e9 melhor do que uma fechada; a coluna d est\u00e1 aberta.", "Qualsiasi colonna aperta \u00e8 meglio di una chiusa; la colonna d \u00e8 aperta."], "Rd1 puts the rook on an open file, ready to invade on d7 or d8.": ["Rd1 pone la torre en una columna abierta, lista para invadir en d7 o d8.", "Rd1 place la tour sur une colonne ouverte, pr\u00eate \u00e0 envahir en d7 ou d8.", "Rd1 stellt den Turm auf eine offene Linie, bereit, auf d7 oder d8 einzudringen.", "Rd1 p\u00f5e a torre numa coluna aberta, pronta para invadir em d7 ou d8.", "Rd1 mette la torre su una colonna aperta, pronta a invadere in d7 o d8."], "A mental box": ["Una caja mental", "Une bo\u00eete mentale", "Ein gedachtes Quadrat", "Uma caixa mental", "Una scatola mentale"], "Draw a square whose side is the number of squares from the pawn to its promotion square. If the defending king can step into that square (with the right side to move), it catches the pawn. If not, the pawn queens.": ["Dibuja un cuadrado cuyo lado sea el n\u00famero de casillas del pe\u00f3n a su casilla de promoci\u00f3n. Si el rey defensor puede entrar en ese cuadrado (con el turno adecuado), alcanza al pe\u00f3n. Si no, el pe\u00f3n corona.", "Dessinez un carr\u00e9 dont le c\u00f4t\u00e9 est le nombre de cases entre le pion et sa case de promotion. Si le roi adverse peut entrer dans ce carr\u00e9 (avec le bon trait), il rattrape le pion. Sinon, le pion devient dame.", "Zeichne ein Quadrat, dessen Seite der Zahl der Felder vom Bauern bis zum Umwandlungsfeld entspricht. Kann der verteidigende K\u00f6nig in dieses Quadrat treten (mit der richtigen Zugseite), holt er den Bauern ein. Wenn nicht, wird der Bauer zur Dame.", "Desenhe um quadrado cujo lado \u00e9 o n\u00famero de casas do pe\u00e3o at\u00e9 \u00e0 casa de promo\u00e7\u00e3o. Se o rei defensor puder entrar nesse quadrado (com a vez certa), apanha o pe\u00e3o. Se n\u00e3o, o pe\u00e3o promove.", "Disegna un quadrato il cui lato \u00e8 il numero di case dal pedone alla casa di promozione. Se il re difensore pu\u00f2 entrare in quel quadrato (con il tratto giusto), raggiunge il pedone. Altrimenti il pedone promuove."], "White to move: pawn a5, black king e6. Can the king stop the pawn?": ["Juegan blancas: pe\u00f3n a5, rey negro e6. \u00bfPuede el rey detener al pe\u00f3n?", "Aux Blancs de jouer : pion a5, roi noir e6. Le roi peut-il arr\u00eater le pion ?", "Wei\u00df am Zug: Bauer a5, schwarzer K\u00f6nig e6. Kann der K\u00f6nig den Bauern aufhalten?", "Jogam as brancas: pe\u00e3o a5, rei preto e6. Pode o rei parar o pe\u00e3o?", "Muove il Bianco: pedone a5, re nero e6. Pu\u00f2 il re fermare il pedone?"], "The pawn needs three moves; the square runs a5\u2013d5\u2013d8\u2013a8. The king on e6 is just outside it: 1.a6 Kd7 2.a7 Kc7 3.a8=Q.": ["El pe\u00f3n necesita tres jugadas; el cuadrado va de a5\u2013d5\u2013d8\u2013a8. El rey en e6 est\u00e1 justo fuera: 1.a6 Kd7 2.a7 Kc7 3.a8=Q.", "Le pion a besoin de trois coups ; le carr\u00e9 va de a5\u2013d5\u2013d8\u2013a8. Le roi en e6 est juste \u00e0 l'ext\u00e9rieur : 1.a6 Kd7 2.a7 Kc7 3.a8=Q.", "Der Bauer braucht drei Z\u00fcge; das Quadrat reicht von a5\u2013d5\u2013d8\u2013a8. Der K\u00f6nig auf e6 steht knapp au\u00dferhalb: 1.a6 Kd7 2.a7 Kc7 3.a8=Q.", "O pe\u00e3o precisa de tr\u00eas jogadas; o quadrado vai de a5\u2013d5\u2013d8\u2013a8. O rei em e6 est\u00e1 mesmo fora: 1.a6 Kd7 2.a7 Kc7 3.a8=Q.", "Il pedone ha bisogno di tre mosse; il quadrato va da a5\u2013d5\u2013d8\u2013a8. Il re in e6 \u00e8 appena fuori: 1.a6 Kd7 2.a7 Kc7 3.a8=Q."], "Face to face": ["Cara a cara", "Face \u00e0 face", "Auge in Auge", "Frente a frente", "Faccia a faccia"], "Two kings are in **opposition** when they stand on the same file (or rank) with exactly one square between them. The side who does **not** have to move holds the opposition, forcing the other king to give way. Getting your king in front of the pawn and winning the opposition decides most pawn endings.": ["Dos reyes est\u00e1n en **oposici\u00f3n** cuando est\u00e1n en la misma columna (o fila) con exactamente una casilla entre ellos. El bando que **no** tiene que mover tiene la oposici\u00f3n y obliga al otro rey a ceder. Poner tu rey delante del pe\u00f3n y ganar la oposici\u00f3n decide la mayor\u00eda de los finales de peones.", "Deux rois sont en **opposition** quand ils sont sur la m\u00eame colonne (ou rang\u00e9e) avec exactement une case entre eux. Le camp qui n'a **pas** le trait d\u00e9tient l'opposition et force l'autre roi \u00e0 c\u00e9der. Placer son roi devant le pion et gagner l'opposition d\u00e9cide la plupart des finales de pions.", "Zwei K\u00f6nige stehen in **Opposition**, wenn sie auf derselben Linie (oder Reihe) mit genau einem Feld dazwischen stehen. Die Seite, die **nicht** ziehen muss, hat die Opposition und zwingt den anderen K\u00f6nig zum Ausweichen. Den K\u00f6nig vor den Bauern zu bringen und die Opposition zu gewinnen, entscheidet die meisten Bauernendspiele.", "Dois reis est\u00e3o em **oposi\u00e7\u00e3o** quando est\u00e3o na mesma coluna (ou fileira) com exatamente uma casa entre eles. O lado que **n\u00e3o** tem de jogar tem a oposi\u00e7\u00e3o e obriga o outro rei a ceder. P\u00f4r o rei \u00e0 frente do pe\u00e3o e ganhar a oposi\u00e7\u00e3o decide a maioria dos finais de pe\u00f5es.", "Due re sono in **opposizione** quando stanno sulla stessa colonna (o traversa) con esattamente una casa in mezzo. Il lato che **non** deve muovere ha l'opposizione e costringe l'altro re a cedere. Portare il re davanti al pedone e vincere l'opposizione decide la maggior parte dei finali di pedoni."], "It is Black's move and the kings face each other with one square between. Who holds the opposition?": ["Mueven las negras y los reyes est\u00e1n frente a frente con una casilla entre ellos. \u00bfQui\u00e9n tiene la oposici\u00f3n?", "C'est aux Noirs de jouer et les rois sont face \u00e0 face avec une case entre eux. Qui d\u00e9tient l'opposition ?", "Schwarz ist am Zug, und die K\u00f6nige stehen sich mit einem Feld dazwischen gegen\u00fcber. Wer hat die Opposition?", "\u00c9 a vez das pretas e os reis est\u00e3o frente a frente com uma casa entre eles. Quem tem a oposi\u00e7\u00e3o?", "Tocca al Nero e i re si fronteggiano con una casa in mezzo. Chi ha l'opposizione?"], "The side that has to move concedes ground. The player NOT to move holds the opposition.": ["El bando que tiene que mover cede terreno. El jugador al que NO le toca mover tiene la oposici\u00f3n.", "Le camp qui doit jouer c\u00e8de du terrain. Le joueur qui N'A PAS le trait d\u00e9tient l'opposition.", "Die Seite, die ziehen muss, gibt Boden preis. Der Spieler, der NICHT am Zug ist, hat die Opposition.", "O lado que tem de jogar cede terreno. O jogador a quem N\u00c3O cabe jogar tem a oposi\u00e7\u00e3o.", "Il lato che deve muovere cede terreno. Il giocatore a cui NON tocca muovere ha l'opposizione."], "The technique": ["La t\u00e9cnica", "La technique", "Die Technik", "A t\u00e9cnica", "La tecnica"], "Use the queen to confine the king to ever smaller boxes (a knight's move away works well), bring your king close, and mate on the edge. Always make sure the enemy king has a legal move unless you are mating.": ["Usa la dama para confinar al rey en cajas cada vez m\u00e1s peque\u00f1as (a un salto de caballo funciona bien), acerca tu rey y da mate en el borde. Aseg\u00farate siempre de que el rey rival tenga una jugada legal salvo que des mate.", "Utilisez la dame pour confiner le roi dans des bo\u00eetes toujours plus petites (\u00e0 un saut de cavalier, c'est efficace), approchez votre roi et mattez au bord. Veillez toujours \u00e0 ce que le roi adverse ait un coup l\u00e9gal, sauf si vous donnez mat.", "Nutze die Dame, um den K\u00f6nig in immer kleinere K\u00e4stchen einzusperren (ein Springerzug Abstand funktioniert gut), bring deinen K\u00f6nig heran und setze am Rand matt. Achte stets darauf, dass der gegnerische K\u00f6nig einen legalen Zug hat, au\u00dfer du setzt matt.", "Use a dama para confinar o rei a caixas cada vez menores (a um salto de cavalo funciona bem), aproxime o seu rei e d\u00ea mate na borda. Garanta sempre que o rei inimigo tem uma jogada legal, a n\u00e3o ser que esteja a dar mate.", "Usa la donna per confinare il re in scatole sempre pi\u00f9 piccole (a un salto di cavallo funziona bene), avvicina il tuo re e dai matto sul bordo. Assicurati sempre che il re avversario abbia una mossa legale, a meno che tu non stia dando matto."], "The white king already covers b7 and b6, so the queen only has to take away the remaining squares without stalemating.": ["El rey blanco ya cubre b7 y b6, as\u00ed que la dama solo tiene que quitar las casillas restantes sin dar ahogado.", "Le roi blanc couvre d\u00e9j\u00e0 b7 et b6 : la dame n'a plus qu'\u00e0 retirer les cases restantes sans faire pat.", "Der wei\u00dfe K\u00f6nig deckt b7 und b6 bereits, die Dame muss also nur die \u00fcbrigen Felder nehmen, ohne Patt zu geben.", "O rei branco j\u00e1 cobre b7 e b6, por isso a dama s\u00f3 tem de tirar as casas restantes sem afogar.", "Il re bianco copre gi\u00e0 b7 e b6, quindi la donna deve solo togliere le case rimaste senza dare stallo."], "Opposition + a rook check": ["Oposici\u00f3n + jaque de torre", "Opposition + \u00e9chec de tour", "Opposition + Turmschach", "Oposi\u00e7\u00e3o + xeque de torre", "Opposizione + scacco di torre"], "With a rook the king must help: get your king to the same file as the enemy king, take the opposition, and the rook delivers a check on the edge.": ["Con una torre el rey debe ayudar: lleva tu rey a la misma columna que el rey enemigo, toma la oposici\u00f3n y la torre da jaque en el borde.", "Avec une tour, le roi doit aider : amenez votre roi sur la m\u00eame colonne que le roi adverse, prenez l'opposition, et la tour donne \u00e9chec au bord.", "Mit dem Turm muss der K\u00f6nig helfen: Bring deinen K\u00f6nig auf dieselbe Linie wie den gegnerischen, nimm die Opposition, und der Turm gibt am Rand Schach.", "Com uma torre o rei tem de ajudar: leve o seu rei \u00e0 mesma coluna do rei inimigo, tome a oposi\u00e7\u00e3o e a torre d\u00e1 xeque na borda.", "Con una torre il re deve aiutare: porta il tuo re sulla stessa colonna del re avversario, prendi l'opposizione e la torre d\u00e0 scacco sul bordo."], "1.Kc7 Ka7 2.Ra1#. The king takes away b7/b8 and the rook mates on the a-file.": ["1.Kc7 Ka7 2.Ra1#. El rey quita b7/b8 y la torre da mate en la columna a.", "1.Kc7 Ka7 2.Ra1#. Le roi enl\u00e8ve b7/b8 et la tour mate sur la colonne a.", "1.Kc7 Ka7 2.Ra1#. Der K\u00f6nig nimmt b7/b8 und der Turm setzt auf der a-Linie matt.", "1.Kc7 Ka7 2.Ra1#. O rei tira b7/b8 e a torre d\u00e1 mate na coluna a.", "1.Kc7 Ka7 2.Ra1#. Il re toglie b7/b8 e la torre d\u00e0 matto sulla colonna a."], "Plan": ["Plan", "Plan", "Plan", "Plano", "Piano"], "In the Giuoco Piano White develops with Bc4 and Nf3, prepares c3 and d4 to build a centre, and castles. Black mirrors with ...Bc5. Learn the first moves.": ["En el Giuoco Piano las blancas desarrollan con Bc4 y Nf3, preparan c3 y d4 para construir un centro y enrocan. Las negras copian con ...Bc5. Aprende las primeras jugadas.", "Dans le Giuoco Piano, les Blancs se d\u00e9veloppent avec Bc4 et Nf3, pr\u00e9parent c3 et d4 pour b\u00e2tir un centre, et roquent. Les Noirs imitent avec ...Bc5. Apprenez les premiers coups.", "Im Giuoco Piano entwickelt Wei\u00df mit Bc4 und Nf3, bereitet c3 und d4 f\u00fcr ein Zentrum vor und rochiert. Schwarz spiegelt mit ...Bc5. Lerne die ersten Z\u00fcge.", "No Giuoco Piano as brancas desenvolvem com Bc4 e Nf3, preparam c3 e d4 para construir um centro e fazem o roque. As pretas espelham com ...Bc5. Aprenda as primeiras jogadas.", "Nel Giuoco Piano il Bianco si sviluppa con Bc4 e Nf3, prepara c3 e d4 per costruire un centro e arrocca. Il Nero specchia con ...Bc5. Impara le prime mosse."], "Play the White moves of the Italian Game.": ["Juega las jugadas blancas de la Partida Italiana.", "Jouez les coups blancs de la Partie italienne.", "Spiele die wei\u00dfen Z\u00fcge der Italienischen Partie.", "Jogue as jogadas brancas do Jogo Italiano.", "Gioca le mosse del Bianco della Partita Italiana."], "You now have a big centre; after Bb4+ White usually answers Bd2 or Nc3.": ["Ya tienes un gran centro; tras Bb4+ las blancas suelen responder Bd2 o Nc3.", "Vous avez maintenant un grand centre ; apr\u00e8s Bb4+, les Blancs r\u00e9pondent g\u00e9n\u00e9ralement Bd2 ou Nc3.", "Du hast jetzt ein gro\u00dfes Zentrum; nach Bb4+ antwortet Wei\u00df meist Bd2 oder Nc3.", "Agora tem um grande centro; depois de Bb4+ as brancas costumam responder Bd2 ou Nc3.", "Ora hai un grande centro; dopo Bb4+ il Bianco di solito risponde Bd2 o Nc3."], "The Ruy Lopez puts the bishop on b5 to pressure the knight that defends e5. White castles, plays Re1, c3 and d4, with a lasting central tension.": ["La Ruy L\u00f3pez coloca el alfil en b5 para presionar al caballo que defiende e5. Las blancas enrocan, juegan Re1, c3 y d4, con una tensi\u00f3n central duradera.", "La Ruy Lopez place le fou en b5 pour presser le cavalier qui d\u00e9fend e5. Les Blancs roquent, jouent Re1, c3 et d4, avec une tension centrale durable.", "Die Spanische Partie stellt den L\u00e4ufer auf b5, um den Springer zu bedr\u00e4ngen, der e5 deckt. Wei\u00df rochiert, spielt Re1, c3 und d4, mit anhaltender Zentrumsspannung.", "A Ruy Lopez p\u00f5e o bispo em b5 para pressionar o cavalo que defende e5. As brancas fazem o roque, jogam Re1, c3 e d4, com uma tens\u00e3o central duradoura.", "La Ruy Lopez porta l'alfiere in b5 per mettere pressione al cavallo che difende e5. Il Bianco arrocca, gioca Re1, c3 e d4, con una tensione centrale duratura."], "Play the White moves of the Closed Ruy Lopez.": ["Juega las jugadas blancas de la Ruy L\u00f3pez Cerrada.", "Jouez les coups blancs de la Ruy Lopez ferm\u00e9e.", "Spiele die wei\u00dfen Z\u00fcge der Geschlossenen Spanischen Partie.", "Jogue as jogadas brancas da Ruy Lopez Fechada.", "Gioca le mosse del Bianco della Ruy Lopez chiusa."], "c3 prepares d4 and gives the bishop the c2 retreat.": ["c3 prepara d4 y da al alfil la retirada a c2.", "c3 pr\u00e9pare d4 et donne au fou la retraite en c2.", "c3 bereitet d4 vor und gibt dem L\u00e4ufer den R\u00fcckzug nach c2.", "c3 prepara d4 e d\u00e1 ao bispo a retirada para c2.", "c3 prepara d4 e d\u00e0 all'alfiere la ritirata in c2."], "Idea": ["Idea", "Id\u00e9e", "Idee", "Ideia", "Idea"], "Black fights for d4 with ...c5 and ...d6. After the knight exchange on d4, ...a6 prepares ...e5 or ...b5 and stops White's knights using b5.": ["Las negras luchan por d4 con ...c5 y ...d6. Tras el cambio de caballos en d4, ...a6 prepara ...e5 o ...b5 e impide que los caballos blancos usen b5.", "Les Noirs luttent pour d4 avec ...c5 et ...d6. Apr\u00e8s l'\u00e9change des cavaliers en d4, ...a6 pr\u00e9pare ...e5 ou ...b5 et emp\u00eache les cavaliers blancs d'utiliser b5.", "Schwarz k\u00e4mpft mit ...c5 und ...d6 um d4. Nach dem Springertausch auf d4 bereitet ...a6 ...e5 oder ...b5 vor und verhindert, dass wei\u00dfe Springer b5 nutzen.", "As pretas lutam por d4 com ...c5 e ...d6. Depois da troca de cavalos em d4, ...a6 prepara ...e5 ou ...b5 e impede os cavalos brancos de usarem b5.", "Il Nero lotta per d4 con ...c5 e ...d6. Dopo lo scambio dei cavalli in d4, ...a6 prepara ...e5 o ...b5 e impedisce ai cavalli bianchi di usare b5."], "Play the Black moves of the Najdorf.": ["Juega las jugadas negras de la Najdorf.", "Jouez les coups noirs de la Najdorf.", "Spiele die schwarzen Z\u00fcge der Najdorf-Variante.", "Jogue as jogadas pretas da Najdorf.", "Gioca le mosse del Nero della Najdorf."], "...a6 is the signature Najdorf move.": ["...a6 es la jugada caracter\u00edstica de la Najdorf.", "...a6 est le coup embl\u00e9matique de la Najdorf.", "...a6 ist der Markenzug der Najdorf-Variante.", "...a6 \u00e9 a jogada caracter\u00edstica da Najdorf.", "...a6 \u00e8 la mossa caratteristica della Najdorf."], "White develops the dark-squared bishop to f4 before closing the pawn chain with e3, then builds with Nf3, c3, Nbd2 and Bd3. Same setup against nearly everything.": ["Las blancas desarrollan el alfil de casillas oscuras a f4 antes de cerrar la cadena de peones con e3, y luego construyen con Nf3, c3, Nbd2 y Bd3. El mismo montaje contra casi todo.", "Les Blancs d\u00e9veloppent le fou de cases noires en f4 avant de fermer la cha\u00eene de pions par e3, puis b\u00e2tissent avec Nf3, c3, Nbd2 et Bd3. M\u00eame dispositif contre presque tout.", "Wei\u00df entwickelt den schwarzfeldrigen L\u00e4ufer nach f4, bevor er die Bauernkette mit e3 schlie\u00dft, und baut dann mit Nf3, c3, Nbd2 und Bd3 auf. Derselbe Aufbau gegen fast alles.", "As brancas desenvolvem o bispo de casas escuras
