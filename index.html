/* Rookery design system. Tokens first; components use only tokens so light/dark and board themes "just work".
   Class vocabulary: .page .card .btn(.primary .danger .small .large .block .ghost) .chip .pill .badge .field .row .col .grid-2/3/4 .tabs .table
   .list .stat .modal .toast .avatar .game-layout .board-wrap .player-strip .clock .moves .eval-bar .muted .center .spacer */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --accent: #e0a33e; --accent-ink: #1a1305;
  --good: #4fbf7a; --bad: #e5645c; --warn: #e6b34a; --info: #5aa2e6;
  --r: 12px; --r-sm: 8px; --shadow: 0 10px 30px rgba(0,0,0,.25); --gap: 16px;
  --sq-light: #ead9b7; --sq-dark: #a8693f;
  --topbar-h: 60px;
}
:root[data-theme="dark"] {
  --bg: #13151b; --bg2: #191c24; --card: #1f232d; --card2: #262b37; --line: #323847; --text: #eceff4; --muted: #98a0b3; --link: #f0c36a; --input: #171a21; color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4efe6; --bg2: #ece5d8; --card: #fffdf8; --card2: #f7f1e5; --line: #ddd3c0; --text: #231f18; --muted: #6f6759; --link: #9a5b0a; --input: #fff; --shadow: 0 8px 24px rgba(80,60,20,.12); color-scheme: light;
}
:root[data-bg="dusk"] body { background: linear-gradient(160deg, var(--bg) 0%, color-mix(in srgb, var(--accent) 14%, var(--bg)) 100%) fixed; }
:root[data-bg="felt"] body { background: radial-gradient(circle at 30% 20%, #1f5a3d, #0f3623) fixed; }
:root[data-bg="paper"] body { background: repeating-linear-gradient(0deg, transparent 0 27px, rgba(120,100,60,.08) 28px), var(--bg) fixed; }
:root[data-bg="grid"] body { background: linear-gradient(var(--line) 1px, transparent 1px) 0 0/32px 32px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/32px 32px, var(--bg) fixed; }
:root[data-bg="aurora"] body { background: radial-gradient(60% 50% at 20% 10%, rgba(90,200,170,.25), transparent), radial-gradient(50% 50% at 85% 20%, rgba(150,110,230,.25), transparent), var(--bg) fixed; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--font); min-height: 100vh; display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0 0 .5em; letter-spacing: .01em; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
p { margin: 0 0 1em; } img, svg { max-width: 100%; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 70%, white); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; background: var(--card); padding: 8px 12px; z-index: 999; }
.muted { color: var(--muted); } .center { text-align: center; } .spacer { flex: 1; } .pad { padding: 10px 14px; } .hidden, [hidden] { display: none !important; }
.mono { font-family: var(--mono); } .small { font-size: .88rem; } .nowrap { white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1400px; margin: 0 auto; height: var(--topbar-h); display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 1.35rem var(--serif); color: var(--text); letter-spacing: .02em; } .brand:hover { text-decoration: none; }
.main-nav { display: flex; gap: 2px; margin-left: 18px; }
.main-nav a { color: var(--muted); padding: 8px 10px; border-radius: 8px; font-weight: 600; font-size: .95rem; } .main-nav a:hover { color: var(--text); background: var(--card); text-decoration: none; }
.main-nav a.active, .drawer a.active, .tabbar a.active { color: var(--accent); }
.main-nav a.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.icon-btn.burger { display: none; }
.search { position: relative; } .search-input { width: 130px; padding: 7px 12px; border-radius: 99px; } .search-input:focus { width: 200px; }
.search-input { transition: width .2s; }
.search-results { position: absolute; right: 0; top: 110%; width: 260px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; z-index: 70; }
.search-results a { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--text); } .search-results a:hover { background: var(--card2); text-decoration: none; }
.user-box { display: flex; align-items: center; gap: 8px; position: relative; }
.user-btn { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px 3px 4px; color: var(--text); cursor: pointer; font-weight: 600; }
.user-menu { display: none; position: absolute; right: 0; top: 120%; min-width: 180px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; z-index: 70; } .user-menu.open { display: block; }
.user-menu a, .user-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 9px 12px; border-radius: 8px; cursor: pointer; font: inherit; } .user-menu a:hover, .user-menu button:hover { background: var(--card2); text-decoration: none; }
.drawer, .scrim { display: none; } .tabbar { display: none; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); opacity: .5; margin-left: auto; } .dot.on { background: var(--good); opacity: 1; }

/* ---------- layout ---------- */
#view { flex: 1; width: 100%; }
.page { max-width: 1200px; margin: 0 auto; padding: 24px 16px 56px; } .page.wide { max-width: 1400px; }
.page.enter { animation: pageIn .28s ease both; } @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
:root[data-noanim="1"] * { animation: none !important; transition: none !important; }
.page-loading { display: grid; place-items: center; min-height: 40vh; }
.row { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; } .col { display: flex; flex-direction: column; gap: var(--gap); }
.grid-2, .grid-3, .grid-4 { display: grid; gap: var(--gap); } .grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); } .grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); } .grid-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.footer { border-top: 1px solid var(--line); padding: 22px 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; max-width: 1400px; margin: 0 auto; width: 100%; font-size: .9rem; color: var(--muted); }
.free-badge { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); padding: 2px 9px; border-radius: 99px; font-weight: 700; font-size: .8rem; }

/* ---------- components ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: 0 1px 0 rgba(255,255,255,.03) inset; }
.card.flush { padding: 0; overflow: hidden; } .card h2, .card h3 { margin-top: 0; }
.card.hover { transition: transform .15s, border-color .15s, box-shadow .15s; cursor: pointer; } .card.hover:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); text-decoration: none; }
a.card { color: var(--text); display: block; } a.card:hover { text-decoration: none; }
.error-box { border-color: var(--bad); }
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font: 600 .95rem var(--font); cursor: pointer; transition: transform .08s, background .15s, border-color .15s; user-select: none; min-height: 40px; }
.btn:hover { border-color: var(--accent); text-decoration: none; } .btn:active { transform: translateY(1px); } .btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); } .btn.danger:hover { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; } .btn.small { padding: 5px 12px; min-height: 32px; font-size: .88rem; } .btn.large { padding: 14px 26px; font-size: 1.1rem; border-radius: 12px; } .btn.block { width: 100%; }
.btn.active { background: color-mix(in srgb, var(--accent) 22%, var(--card2)); border-color: var(--accent); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text); cursor: pointer; font-size: 1.1rem; display: inline-grid; place-items: center; } .icon-btn:hover { background: var(--card); border-color: var(--line); }
.chip, .pill, .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; font-size: .8rem; font-weight: 700; background: var(--card2); border: 1px solid var(--line); color: var(--muted); }
.pill.good { color: var(--good); border-color: var(--good); } .pill.bad { color: var(--bad); border-color: var(--bad); } .pill.warn { color: var(--warn); border-color: var(--warn); } .pill.accent { color: var(--accent); border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; } .field > span { font-weight: 600; font-size: .9rem; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 42px; } input[type=range] { padding: 0; min-height: 0; } input[type=checkbox], input[type=radio] { width: auto; min-height: 0; accent-color: var(--accent); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
textarea { resize: vertical; font-family: var(--mono); font-size: .9rem; }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; } .form-error { color: var(--bad); margin: 8px 0; min-height: 1.2em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; } .seg button { border: 0; background: var(--card2); color: var(--text); padding: 8px 14px; cursor: pointer; font: 600 .9rem var(--font); border-right: 1px solid var(--line); } .seg button:last-child { border: 0; } .seg button.active { background: var(--accent); color: var(--accent-ink); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { background: none; border: 0; color: var(--muted); padding: 10px 16px; font: 600 .95rem var(--font); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; } .tab:hover { color: var(--text); } .tab.active { color: var(--accent); border-color: var(--accent); }
.table { width: 100%; border-collapse: collapse; } .table th, .table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); } .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); } .table tr:hover td { background: color-mix(in srgb, var(--card2) 60%, transparent); } .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.list { display: flex; flex-direction: column; } .list > * { padding: 11px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; } .list > *:last-child { border-bottom: 0; }
.stat { display: flex; flex-direction: column; gap: 2px; } .stat b { font: 700 1.7rem var(--serif); } .stat span { color: var(--muted); font-size: .85rem; }
.avatar { border-radius: 50%; object-fit: cover; flex: none; display: inline-grid; place-items: center; color: #fff; font-weight: 700; } .avatar.init { line-height: 1; }
.ulink { color: inherit; font-weight: 600; } .win { color: var(--good); } .loss { color: var(--bad); } .draw { color: var(--muted); }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; } @keyframes shimmer { to { background-position: -200% 0; } }
.progress { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; } .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* modal & toast */
.modal-back { position: fixed; inset: 0; background: rgba(5,7,12,.6); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 200; padding: 16px; animation: fade .15s; } @keyframes fade { from { opacity: 0; } }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; width: min(100%, 460px); max-height: 90vh; overflow: auto; box-shadow: var(--shadow); animation: pop .18s; } .modal.wide { width: min(100%, 760px); } @keyframes pop { from { transform: scale(.96); opacity: 0; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); } .modal-head h3 { margin: 0; } .modal-body { padding: 18px; } .modal-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 0 18px 18px; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; max-width: calc(100vw - 32px); }
.toast { background: var(--card2); border: 1px solid var(--line); border-left: 4px solid var(--info); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: all .25s; max-width: 380px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toast.in { opacity: 1; transform: none; } .toast.success { border-left-color: var(--good); } .toast.error { border-left-color: var(--bad); } .toast.challenge { border-left-color: var(--accent); }

/* ---------- board ---------- */
.board { position: relative; width: 100%; aspect-ratio: 1; user-select: none; -webkit-user-select: none; touch-action: none; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.35); outline: none; }
.board .sq-layer, .board .hl-layer, .board .pc-layer, .board .arrow-layer { position: absolute; inset: 0; } .board .arrow-layer { width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.sq { position: absolute; width: 12.5%; height: 12.5%; } .sq.light { background: var(--sq-light); } .sq.dark { background: var(--sq-dark); }
.coord { position: absolute; font: 700 clamp(8px, 1.6vw, 12px) var(--font); font-style: normal; pointer-events: none; } .coord.rank { left: 3px; top: 2px; } .coord.file { right: 3px; bottom: 1px; }
.sq.light .coord { color: var(--sq-dark); } .sq.dark .coord { color: var(--sq-light); }
.hl-layer { pointer-events: none; z-index: 1; } .hl { position: absolute; width: 12.5%; height: 12.5%; }
.hl.last { background: rgba(255, 214, 70, .42); } .hl.sel { background: rgba(90, 170, 255, .45); } .hl.hint { background: rgba(80, 220, 130, .5); }
.hl.dot::after { content: ""; position: absolute; inset: 35%; border-radius: 50%; background: rgba(20,20,30,.28); } .hl.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid rgba(20,20,30,.28); }
.hl.check { background: radial-gradient(circle, rgba(255,40,40,.95) 0%, rgba(255,40,40,.55) 45%, transparent 75%); }
.pc-layer { z-index: 2; } .piece { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transition: transform .16s ease; cursor: grab; will-change: transform; touch-action: none; }
.piece svg { width: 100%; height: 100%; display: block; pointer-events: none; filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.35)); } .piece.dragging { z-index: 10; cursor: grabbing; } .piece.gone { opacity: 0; transition: opacity .15s; }
.promo-back { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 8; } .promo-choice { position: absolute; width: 12.5%; height: 12.5%; border: 0; background: var(--card); border-radius: 50%; box-shadow: 0 4px 14px rgba(0,0,0,.4); cursor: pointer; padding: 2px; transform: scale(1.05); } .promo-choice:hover { background: var(--accent); } .promo-choice svg { width: 100%; height: 100%; }

/* ---------- game layout ---------- */
.game-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; max-width: 1180px; margin: 0 auto; }
.board-col { width: min(100%, calc(100vh - var(--topbar-h) - 150px)); min-width: 280px; margin: 0 auto; }
.board-col.fill { width: 100%; max-width: max(320px, calc(100vh - 200px)); }
.player-strip { display: flex; align-items: center; gap: 10px; padding: 7px 4px; min-height: 50px; }
.player-strip .pname { font-weight: 700; } .player-strip .prating { color: var(--muted); font-size: .9rem; } .player-strip .caps { font-size: 1rem; letter-spacing: -2px; color: var(--muted); min-height: 1.2em; }
.clock { margin-left: auto; font: 700 1.6rem var(--mono); background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; min-width: 94px; text-align: center; font-variant-numeric: tabular-nums; transition: background .2s, color .2s; }
.clock.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .clock.low { background: var(--bad); color: #fff; border-color: var(--bad); animation: pulse 1s infinite; } @keyframes pulse { 50% { opacity: .75; } }
.side-panel { display: flex; flex-direction: column; gap: 14px; }
.moves { max-height: 260px; overflow-y: auto; display: grid; grid-template-columns: 38px 1fr 1fr; font: .95rem var(--mono); } .moves .n { color: var(--muted); padding: 4px 6px; } .moves .m { padding: 4px 8px; border-radius: 6px; cursor: pointer; } .moves .m:hover { background: var(--card2); } .moves .m.cur { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.panel-title { font: 700 .8rem var(--font); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; } .controls .btn { flex: 1 1 auto; }
.nav-btns { display: flex; gap: 6px; justify-content: center; } .nav-btns .btn { flex: 1; font-size: 1.1rem; }
.result-banner { text-align: center; padding: 14px; border-radius: var(--r); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--card)), var(--card)); border: 1px solid var(--accent); } .result-banner h3 { margin: 0 0 4px; font-size: 1.4rem; }
.chat { display: flex; flex-direction: column; height: 200px; } .chat-log { flex: 1; overflow-y: auto; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px; } .chat-log b { color: var(--accent); } .chat form { display: flex; gap: 6px; } .chat input { min-height: 36px; padding: 6px 10px; }
.eval-bar { width: 26px; border-radius: 6px; overflow: hidden; background: #2b2e38; position: relative; border: 1px solid var(--line); flex: none; } .eval-bar .w { position: absolute; left: 0; right: 0; bottom: 0; background: #f3efe4; transition: height .35s; } .eval-bar span { position: absolute; left: 0; right: 0; font: 700 10px var(--mono); text-align: center; mix-blend-mode: difference; color: #fff; }
.mini-board { width: 100%; aspect-ratio: 1; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 36px; align-items: center; padding: 30px 0 10px; }
.hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.8rem); margin-bottom: .3em; } .hero h1 em { color: var(--accent); font-style: normal; }
.hero .lead { font-size: 1.15rem; color: var(--muted); max-width: 34em; } .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0; }
.hero-board { max-width: 440px; width: 100%; margin: 0 auto; }

const rnd = mulberry32(0xC0FFEE);
const zLo = new Int32Array(16 * 128), zHi = new Int32Array(16 * 128);
for (let i = 0; i < zLo.length; i++) { zLo[i] = rnd(); zHi[i] = rnd(); }
const zSideLo = rnd(), zSideHi = rnd();
const zCastLo = new Int32Array(16), zCastHi = new Int32Array(16);
for (let i = 0; i < 16; i++) { zCastLo[i] = rnd(); zCastHi[i] = rnd(); }
const zEpLo = new Int32Array(8), zEpHi = new Int32Array(8);
for (let i = 0; i < 8; i++) { zEpLo[i] = rnd(); zEpHi[i] = rnd(); }

const MAXPLY = 2048;

class Chess {
  constructor(fen = START_FEN) {
    this.b = new Int8Array(128);
    this.kings = [4, 116];
    this.sM = new Int32Array(MAXPLY); this.sCap = new Int8Array(MAXPLY);
    this.sCast = new Int8Array(MAXPLY); this.sEp = new Int16Array(MAXPLY);
    this.sHalf = new Int16Array(MAXPLY); this.sLo = new Int32Array(MAXPLY); this.sHi = new Int32Array(MAXPLY);
    this.kLo = new Int32Array(MAXPLY + 1); this.kHi = new Int32Array(MAXPLY + 1);
    this.sans = [];
    this.load(fen);
  }

  // ---------- FEN ----------
  load(fen) {
    const parts = String(fen).trim().split(/\s+/);
    if (parts.length < 4) throw new Error('Invalid FEN: need at least 4 fields');
    const rows = parts[0].split('/');
    if (rows.length !== 8) throw new Error('Invalid FEN: need 8 ranks');
    const b = new Int8Array(128);
    const kings = [-1, -1];
    const counts = [0, 0];
    for (let r = 0; r < 8; r++) {
      let f = 0;
      for (const ch of rows[r]) {
        if (ch >= '1' && ch <= '8') { f += +ch; continue; }
        const lower = ch.toLowerCase();
        const t = TYPE_CHARS.indexOf(lower);
        if (t < 1 || f > 7) throw new Error('Invalid FEN: bad piece placement');
        const color = ch === lower ? 1 : 0;
        const sq = (7 - r) * 16 + f;
        if (t === P && ((sq >> 4) === 0 || (sq >> 4) === 7)) throw new Error('Invalid FEN: pawn on back rank');
        if (t === K) { if (kings[color] !== -1) throw new Error('Invalid FEN: two kings'); kings[color] = sq; }
        b[sq] = t | (color << 3); counts[color]++;
        f++;
      }
      if (f !== 8) throw new Error('Invalid FEN: rank does not have 8 files');
    }
    if (kings[0] < 0 || kings[1] < 0) throw new Error('Invalid FEN: both kings required');
    if (parts[1] !== 'w' && parts[1] !== 'b') throw new Error('Invalid FEN: side to move');
    this.b = b; this.kings = kings;
    this.turn = parts[1] === 'w' ? 0 : 1;
    let c = 0;
    const cs = parts[2];
    if (cs !== '-') for (const ch of cs) {
      const bit = { K: 1, Q: 2, k: 4, q: 8 }[ch];
      if (!bit) throw new Error('Invalid FEN: castling');
      c |= bit;
    }
    // drop castling rights that are impossible
    if (b[4] !== (K | 0)) c &= ~3;
    if (b[116] !== (K | 8)) c &= ~12;
    if (b[7] !== (R | 0)) c &= ~1;
    if (b[0] !== (R | 0)) c &= ~2;
    if (b[119] !== (R | 8)) c &= ~4;
    if (b[112] !== (R | 8)) c &= ~8;
    this.castling = c;
    this.ep = -1;
    if (parts[3] !== '-') {
      const e = sqFromName(parts[3]);
      if (e < 0) throw new Error('Invalid FEN: en passant');
      this.ep = e;
    }
    this.half = parts[4] !== undefined ? Math.max(0, parseInt(parts[4], 10) || 0) : 0;
    this.full = parts[5] !== undefined ? Math.max(1, parseInt(parts[5], 10) || 1) : 1;
    this.startFull = this.full; this.startTurn = this.turn;
    this.ply = 0; this.sans = [];
    // the side that is NOT to move must not be in check
    if (this.isAttacked(kings[this.turn ^ 1], this.turn)) throw new Error('Invalid FEN: opponent king in check');
    this.startFen = null;
    this.computeHash();
    this.startFen = this.fen();
    return true;
  }

  computeHash() {
    let lo = 0, hi = 0;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) continue;
      const p = this.b[s];
      if (p) { lo ^= zLo[p * 128 + s]; hi ^= zHi[p * 128 + s]; }
    }
    if (this.turn) { lo ^= zSideLo; hi ^= zSideHi; }
    lo ^= zCastLo[this.castling]; hi ^= zCastHi[this.castling];
    this.hLo = lo; this.hHi = hi;
    this.setKey(0);
  }

  epCapturable() {
    if (this.ep < 0) return false;
    const us = this.turn, dir = us === 0 ? -16 : 16; // squares from which our pawns capture onto ep
    const pawn = P | (us << 3);
    for (const d of [dir - 1, dir + 1]) {
      const s = this.ep + d;
      if (!(s & 0x88) && this.b[s] === pawn) return true;
    }
    return false;
  }

  setKey(i) {
    let lo = this.hLo, hi = this.hHi;
    if (this.ep >= 0 && this.epCapturable()) { lo ^= zEpLo[this.ep & 7]; hi ^= zEpHi[this.ep & 7]; }
    this.kLo[i] = lo; this.kHi[i] = hi;
  }

  fen() {
    let s = '';
    for (let r = 7; r >= 0; r--) {
      let empty = 0;
      for (let f = 0; f < 8; f++) {
        const p = this.b[r * 16 + f];
        if (!p) { empty++; continue; }
        if (empty) { s += empty; empty = 0; }
        const ch = TYPE_CHARS[p & 7];
        s += (p >> 3) ? ch : ch.toUpperCase();
      }
      if (empty) s += empty;
      if (r) s += '/';
    }
    let c = '';
    if (this.castling & 1) c += 'K'; if (this.castling & 2) c += 'Q';
    if (this.castling & 4) c += 'k'; if (this.castling & 8) c += 'q';
    const ep = this.ep >= 0 && this.epCapturable() ? sqName(this.ep) : '-';
    return `${s} ${this.turn ? 'b' : 'w'} ${c || '-'} ${ep} ${this.half} ${this.full}`;
  }

  // ---------- attacks ----------
  isAttacked(sq, by) {
    const b = this.b, c = by << 3;
    let s;
    if (by === 0) {
      s = sq - 15; if (!(s & 0x88) && b[s] === 1) return true;
      s = sq - 17; if (!(s & 0x88) && b[s] === 1) return true;
    } else {
      s = sq + 15; if (!(s & 0x88) && b[s] === 9) return true;
      s = sq + 17; if (!(s & 0x88) && b[s] === 9) return true;
    }
    for (let i = 0; i < 8; i++) { s = sq + KNIGHT_OFFS[i]; if (!(s & 0x88) && b[s] === (c | N)) return true; }
    for (let i = 0; i < 8; i++) { s = sq + KING_OFFS[i]; if (!(s & 0x88) && b[s] === (c | K)) return true; }
    for (let i = 0; i < 4; i++) {
      const o = BISHOP_OFFS[i]; s = sq + o;
      while (!(s & 0x88)) { const p = b[s]; if (p) { if (p === (c | B) || p === (c | Q)) return true; break; } s += o; }
    }
    for (let i = 0; i < 4; i++) {
      const o = ROOK_OFFS[i]; s = sq + o;
      while (!(s & 0x88)) { const p = b[s]; if (p) { if (p === (c | R) || p === (c | Q)) return true; break; } s += o; }
    }
    return false;
  }

  inCheck() { return this.isAttacked(this.kings[this.turn], this.turn ^ 1); }

  // ---------- generation ----------
  gen(out = [], capsOnly = false) {
    const b = this.b, us = this.turn;
    out.length = 0;
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const from = r * 16 + f, pc = b[from];
        if (!pc || (pc >> 3) !== us) continue;
        const t = pc & 7;
        if (t === P) {
          const dir = us === 0 ? 16 : -16, startR = us === 0 ? 1 : 6, promoR = us === 0 ? 6 : 1;
          const one = from + dir;
          if (!(one & 0x88) && !b[one]) {
            if (r === promoR) { for (let p = Q; p >= N; p--) out.push(mkMove(from, one, p, 0)); }
            else if (!capsOnly) {
              out.push(mkMove(from, one, 0, 0));
              const two = one + dir;
              if (r === startR && !b[two]) out.push(mkMove(from, two, 0, F_DBL));
            }
          }
          for (let k = -1; k <= 1; k += 2) {
            const to = from + dir + k;
            if (to & 0x88) continue;
            const tp = b[to];
            if (tp && (tp >> 3) !== us) {
              if (r === promoR) { for (let p = Q; p >= N; p--) out.push(mkMove(from, to, p, F_CAP)); }
              else out.push(mkMove(from, to, 0, F_CAP));
            } else if (!tp && to === this.ep) out.push(mkMove(from, to, 0, F_EP | F_CAP));
          }
        } else if (t === N || t === K) {
          const offs = t === N ? KNIGHT_OFFS : KING_OFFS;
          for (let i = 0; i < 8; i++) {
            const to = from + offs[i];
            if (to & 0x88) continue;
            const tp = b[to];
            if (!tp) { if (!capsOnly) out.push(mkMove(from, to, 0, 0)); }
            else if ((tp >> 3) !== us) out.push(mkMove(from, to, 0, F_CAP));
          }
        } else {
          const offs = t === B ? BISHOP_OFFS : t === R ? ROOK_OFFS : KING_OFFS;
          const n = t === Q ? 8 : 4;
          for (let i = 0; i < n; i++) {
            const o = offs[i]; let to = from + o;
            while (!(to & 0x88)) {
              const tp = b[to];
              if (!tp) { if (!capsOnly) out.push(mkMove(from, to, 0, 0)); }
              else { if ((tp >> 3) !== us) out.push(mkMove(from, to, 0, F_CAP)); break; }
              to += o;
            }
          }
        }
      }
    }
    if (!capsOnly) {
      const base = us === 0 ? 0 : 112, them = us ^ 1;
      const ks = us === 0 ? 1 : 4, qs = us === 0 ? 2 : 8;
      if ((this.castling & (ks | qs)) && b[base + 4] === (K | (us << 3)) && !this.isAttacked(base + 4, them)) {
        if ((this.castling & ks) && !b[base + 5] && !b[base + 6] && b[base + 7] === (R | (us << 3)) &&
            !this.isAttacked(base + 5, them) && !this.isAttacked(base + 6, them)) out.push(mkMove(base + 4, base + 6, 0, F_KS));
        if ((this.castling & qs) && !b[base + 3] && !b[base + 2] && !b[base + 1] && b[base] === (R | (us << 3)) &&
            !this.isAttacked(base + 3, them) && !this.isAttacked(base + 2, them)) out.push(mkMove(base + 4, base + 2, 0, F_QS));
      }
    }
    return out;
  }

  // ---------- make / unmake ----------
  make(m) {
    const b = this.b, us = this.turn, i = this.ply;
    const from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, fl = m >> 17;
    const pc = b[from];
    let cap = b[to];
    this.sM[i] = m; this.sCast[i] = this.castling; this.sEp[i] = this.ep; this.sHalf[i] = this.half;
    this.sLo[i] = this.hLo; this.sHi[i] = this.hHi;
    let lo = this.hLo, hi = this.hHi;
    lo ^= zCastLo[this.castling]; hi ^= zCastHi[this.castling];
    const np = promo ? (promo | (us << 3)) : pc;
    lo ^= zLo[pc * 128 + from] ^ zLo[np * 128 + to];
    hi ^= zHi[pc * 128 + from] ^ zHi[np * 128 + to];
    if (fl & F_EP) {
      const cs = us === 0 ? to - 16 : to + 16;
      cap = b[cs]; b[cs] = 0;
      lo ^= zLo[cap * 128 + cs]; hi ^= zHi[cap * 128 + cs];
    } else if (cap) {
      lo ^= zLo[cap * 128 + to]; hi ^= zHi[cap * 128 + to];
    }
    this.sCap[i] = cap;
    b[to] = np; b[from] = 0;
    if ((pc & 7) === K) this.kings[us] = to;
    if (fl & F_KS) {
      const rp = R | (us << 3);
      b[to - 1] = rp; b[to + 1] = 0;
      lo ^= zLo[rp * 128 + to + 1] ^ zLo[rp * 128 + to - 1]; hi ^= zHi[rp * 128 + to + 1] ^ zHi[rp * 128 + to - 1];
    } else if (fl & F_QS) {
      const rp = R | (us << 3);
      b[to + 1] = rp; b[to - 2] = 0;
      lo ^= zLo[rp * 128 + to - 2] ^ zLo[rp * 128 + to + 1]; hi ^= zHi[rp * 128 + to - 2] ^ zHi[rp * 128 + to + 1];
    }
    this.castling &= CASTLE_MASK[from] & CASTLE_MASK[to];
    lo ^= zCastLo[this.castling]; hi ^= zCastHi[this.castling];
    this.ep = (fl & F_DBL) ? (us === 0 ? from + 16 : from - 16) : -1;
    this.half = ((pc & 7) === P || cap) ? 0 : this.half + 1;
    this.turn = us ^ 1;
    lo ^= zSideLo; hi ^= zSideHi;
    if (us === 1) this.full++;
    this.hLo = lo; this.hHi = hi;
    this.ply = i + 1;
    this.setKey(i + 1);
  }

  unmake() {
    const i = --this.ply, b = this.b;
    const m = this.sM[i], us = this.turn ^ 1;
    this.turn = us;
    if (m === 0) { // null move
      this.ep = this.sEp[i]; this.half = this.sHalf[i]; this.hLo = this.sLo[i]; this.hHi = this.sHi[i];
      if (us === 1) this.full--;
      return;
    }
    const from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, fl = m >> 17;
    const cap = this.sCap[i];
    let pc = b[to];
    if (promo) pc = P | (us << 3);
    b[from] = pc;
    if (fl & F_EP) { b[to] = 0; b[us === 0 ? to - 16 : to + 16] = cap; }
    else b[to] = cap;
    if ((pc & 7) === K) this.kings[us] = from;
    if (fl & F_KS) { b[to + 1] = R | (us << 3); b[to - 1] = 0; }
    else if (fl & F_QS) { b[to - 2] = R | (us << 3); b[to + 1] = 0; }
    this.castling = this.sCast[i]; this.ep = this.sEp[i]; this.half = this.sHalf[i];
    this.hLo = this.sLo[i]; this.hHi = this.sHi[i];
    if (us === 1) this.full--;
  }

  makeNull() {
    const i = this.ply;
    this.sM[i] = 0; this.sEp[i] = this.ep; this.sHalf[i] = this.half; this.sLo[i] = this.hLo; this.sHi[i] = this.hHi;
    this.ep = -1; this.half++;
    this.turn ^= 1; this.hLo ^= zSideLo; this.hHi ^= zSideHi;
    if (this.turn === 0) this.full++;
    this.ply = i + 1;
    this.setKey(i + 1);
  }

  /** make + legality check; returns false (and leaves position untouched) if the move leaves own king in check */
  makeLegal(m) {
    const us = this.turn;
    this.make(m);
    if (this.isAttacked(this.kings[us], us ^ 1)) { this.unmake(); return false; }
    return true;
  }

  legalMoves() {
    const pseudo = this.gen([]), res = [];
    for (let i = 0; i < pseudo.length; i++) {
      if (this.makeLegal(pseudo[i])) { this.unmake(); res.push(pseudo[i]); }
    }
    return res;
  }

  hasLegalMove() {
    const pseudo = this.gen([]);
    for (let i = 0; i < pseudo.length; i++) {
      if (this.makeLegal(pseudo[i])) { this.unmake(); return true; }
    }
    return false;
  }

  perft(depth) {
    if (depth === 0) return 1;
    const ms = this.gen([]);
    let n = 0;
    for (let i = 0; i < ms.length; i++) {
      if (!this.makeLegal(ms[i])) continue;
      n += depth === 1 ? 1 : this.perft(depth - 1);
      this.unmake();
    }
    return n;
  }

  // ---------- SAN ----------
  sanOf(m, legal = null) {
    const from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, fl = m >> 17;
    const pc = this.b[from], t = pc & 7;
    let s;
    if (fl & F_KS) s = 'O-O';
    else if (fl & F_QS) s = 'O-O-O';
    else if (t === P) {
      s = (fl & F_CAP) ? FILES[from & 7] + 'x' : '';
      s += sqName(to);
      if (promo) s += '=' + PIECE_LETTERS[promo];
    } else {
      s = PIECE_LETTERS[t];
      const others = (legal || this.legalMoves()).filter((o) => o !== m && ((this.b[o & 127] & 7) === t) && (((o >> 7) & 127) === to) && ((o & 127) !== from));
      if (others.length) {
        const sameFile = others.some((o) => (o & 7) === (from & 7));
        const sameRank = others.some((o) => ((o & 127) >> 4) === (from >> 4));
        if (!sameFile) s += FILES[from & 7];
        else if (!sameRank) s += (from >> 4) + 1;
        else s += FILES[from & 7] + ((from >> 4) + 1);
      }
      if (fl & F_CAP) s += 'x';
      s += sqName(to);
    }
    this.make(m);
    if (this.inCheck()) s += this.hasLegalMove() ? '+' : '#';
    this.unmake();
    return s;
  }

  parseSan(str) {
    if (typeof str !== 'string') return 0;
    let s = str.trim().replace(/[+#!?]+$/g, '').replace(/0/g, 'O').replace(/e\.p\.$/, '').trim();
    if (!s) return 0;
    const legal = this.legalMoves();
    if (/^O-O(-O)?$/.test(s)) {
      const flag = s === 'O-O' ? F_KS : F_QS;
      return legal.find((m) => (m >> 17) & flag) || 0;
    }
    const mt = /^([NBRQK])?([a-h])?([1-8])?(x|-)?([a-h][1-8])(?:=?([NBRQ]))?$/.exec(s);
    if (!mt) return 0;
    const type = mt[1] ? PIECE_LETTERS.indexOf(mt[1]) : P;
    const to = sqFromName(mt[5]);
    const promo = mt[6] ? PIECE_LETTERS.indexOf(mt[6]) : 0;
    const cands = legal.filter((m) => {
      if (((m >> 7) & 127) !== to) return false;
      const from = m & 127;
      if ((this.b[from] & 7) !== type) return false;
      if (((m >> 14) & 7) !== promo) return false;
      if (mt[2] && FILES[from & 7] !== mt[2]) return false;
      if (mt[3] && String((from >> 4) + 1) !== mt[3]) return false;
      return true;
    });
    return cands.length === 1 ? cands[0] : 0;
  }

  parseUci(u) {
    if (typeof u !== 'string' || u.length < 4) return 0;
    const from = sqFromName(u.slice(0, 2)), to = sqFromName(u.slice(2, 4));
    if (from < 0 || to < 0) return 0;
    const promo = u[4] ? 'nbrq'.indexOf(u[4].toLowerCase()) + 2 : 0;
    if (u[4] && promo < 2) return 0;
    return this.legalMoves().find((m) => (m & 127) === from && ((m >> 7) & 127) === to && ((m >> 14) & 7) === promo) || 0;
  }

  uciOf(m) {
    const p = (m >> 14) & 7;
    return sqName(m & 127) + sqName((m >> 7) & 127) + (p ? TYPE_CHARS[p] : '');
  }

  describe(m, san) {
    const from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, fl = m >> 17;
    const pc = this.b[from];
    const captured = (fl & F_EP) ? P : (this.b[to] & 7) || 0;
    const flags = (fl & F_CAP ? 'c' : '') + (fl & F_EP ? 'e' : '') + (fl & F_KS ? 'k' : '') + (fl & F_QS ? 'q' : '') +
      (fl & F_DBL ? 'b' : '') + (promo ? 'p' : '');
    const o = { color: (pc >> 3) ? 'b' : 'w', from: sqName(from), to: sqName(to), piece: TYPE_CHARS[pc & 7], san, flags };
    if (captured) o.captured = TYPE_CHARS[captured];
    if (promo) o.promotion = TYPE_CHARS[promo];
    o.lan = o.from + o.to + (promo ? TYPE_CHARS[promo] : '');
    return o;
  }

  // ---------- friendly API ----------
  turnColor() { return this.turn ? 'b' : 'w'; }

  moves({ verbose = false, square = null } = {}) {
    const legal = this.legalMoves();
    let list = legal;
    if (square) { const sq = sqFromName(square); list = legal.filter((m) => (m & 127) === sq); }
    return list.map((m) => { const san = this.sanOf(m, legal); return verbose ? this.describe(m, san) : san; });
  }

  /** Accepts SAN string, UCI string, or {from,to,promotion}. Returns move descriptor or null. */
  move(arg) {
    let m = 0;
    if (typeof arg === 'string') {
      m = this.parseSan(arg);
      if (!m && /^[a-h][1-8][a-h][1-8][nbrqNBRQ]?$/.test(arg)) m = this.parseUci(arg.toLowerCase());
    } else if (arg && arg.from && arg.to) {
      const promo = arg.promotion ? 'nbrq'.indexOf(String(arg.promotion).toLowerCase()) + 2 : 0;
      const from = sqFromName(arg.from), to = sqFromName(arg.to);
      m = this.legalMoves().find((x) => (x & 127) === from && ((x >> 7) & 127) === to && ((x >> 14) & 7) === promo) || 0;
    }
    if (!m) return null;
    const legal = this.legalMoves();
    const san = this.sanOf(m, legal);
    const desc = this.describe(m, san);
    this.make(m);
    this.sans[this.ply - 1] = san;
    return desc;
  }

  undo() {
    if (this.ply === 0) return null;
    const san = this.sans[this.ply - 1];
    this.unmake();
    this.sans.length = this.ply;
    return san;
  }

  history() { return this.sans.slice(0, this.ply); }
  historyUci() { const r = []; for (let i = 0; i < this.ply; i++) r.push(this.uciOf(this.sM[i])); return r; }

  get(square) {
    const p = this.b[sqFromName(square)];
    return p ? { type: TYPE_CHARS[p & 7], color: (p >> 3) ? 'b' : 'w' } : null;
  }

  board() {
    const rows = [];
    for (let r = 7; r >= 0; r--) {
      const row = [];
      for (let f = 0; f < 8; f++) {
        const p = this.b[r * 16 + f];
        row.push(p ? { type: TYPE_CHARS[p & 7], color: (p >> 3) ? 'b' : 'w', square: FILES[f] + (r + 1) } : null);
      }
      rows.push(row);
    }
    return rows;
  }

  // ---------- game state ----------
  isCheck() { return this.inCheck(); }
  isCheckmate() { return this.inCheck() && !this.hasLegalMove(); }
  isStalemate() { return !this.inCheck() && !this.hasLegalMove(); }

  isInsufficientMaterial() {
    const minors = [];
    let bishopsW = 0, bishopsB = 0, others = 0;
    for (let s = 0; s < 128; s++) {

  // ---------------------------------------------------------------- BEGINNER / Fundamentals
  { id: 'board-and-notation', level: 'beginner', category: 'Fundamentals', title: 'The board and notation', summary: 'Files, ranks, squares and how moves are written.', minutes: 5, steps: [
    T('Eight by eight', 'The board has 64 squares. Columns are called **files** (a\u2013h) and rows are **ranks** (1\u20138). Every square has a name made of its file and rank \u2014 the white king starts on e1. The bottom-right square (h1) is always a light square.', { fen: '4k3/8/8/8/8/8/8/4K3 w - - 0 1', marks: ['e1', 'e8'] }),
    T('Setting up', 'White always moves first. The queen goes on her own colour (white queen on a light square, d1). Pawns fill the second and seventh ranks. Learn this picture \u2014 every game starts here.', { fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1' }),
    T('Writing moves', 'A move is the piece letter plus the destination: **Nf3** means a knight goes to f3. Pawn moves have no letter: **e4**. A capture adds an x: **Bxc6**. K = king, Q = queen, R = rook, B = bishop, N = knight.'),
    { type: 'exercise', kind: 'move', prompt: 'Play the pawn from e2 to e4 (written e4).', fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', solutions: ['e2e4'], hint: 'The pawn on e2 may move two squares on its first move.', explain: 'e4 takes space in the centre and opens lines for the queen and bishop.' },
    { type: 'exercise', kind: 'move', prompt: 'Develop a knight: play Nf3.', fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', solutions: ['g1f3'], hint: 'The knight on g1 jumps to f3.', explain: 'Knights belong near the centre. Nf3 also eyes the d4 and e5 squares.' },
  ] },
  { id: 'pawns', level: 'beginner', category: 'Fundamentals', title: 'How pawns move', summary: 'Forward, double-step, and capture diagonally.', minutes: 4, steps: [
    T('Forward only', 'Pawns move one square forward. From their starting square they may move two. They never move backward, and they cannot capture the piece in front of them.', { fen: '4k3/8/8/8/8/8/4P3/4K3 w - - 0 1', marks: ['e3', 'e4'] }),
    { type: 'exercise', kind: 'reach', prompt: 'Click every square the pawn on e2 can move to.', fen: '4k3/8/8/8/8/8/4P3/4K3 w - - 0 1', square: 'e2' },
    T('Capturing', 'Pawns capture one square diagonally forward \u2014 different from how they move. That is why pawns can block each other head-on.'),
    { type: 'exercise', kind: 'move', prompt: 'Capture the pawn on d5 with your e4 pawn.', fen: 'rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', solutions: ['e4d5'], hint: 'Diagonally forward.', explain: 'exd5 wins a pawn and opens the d-file for Black\'s queen to recapture \u2014 a classic Scandinavian Defence.' },
  ] },
  { id: 'knights', level: 'beginner', category: 'Fundamentals', title: 'The knight', summary: 'The L-shaped jumper that ignores blockers.', minutes: 4, steps: [
    T('An L-shaped jump', 'The knight moves two squares in one direction and one square sideways. It is the only piece that **jumps over** others. In the centre it controls eight squares; in a corner only two.', { fen: '7k/8/8/8/3N4/8/8/K7 w - - 0 1', marks: ['b3', 'b5', 'c2', 'c6', 'e2', 'e6', 'f3', 'f5'] }),
    { type: 'exercise', kind: 'reach', prompt: 'Click all eight squares the knight on d4 can reach.', fen: '7k/8/8/8/3N4/8/8/K7 w - - 0 1', square: 'd4' },
    T('Rule of thumb', '"A knight on the rim is dim." Knights are strongest in the centre where they attack the most squares.'),
  ] },
  { id: 'bishops', level: 'beginner', category: 'Fundamentals', title: 'The bishop', summary: 'Diagonal glider \u2014 stays on one colour.', minutes: 3, steps: [
    T('Diagonals only', 'A bishop slides any distance along a diagonal until something blocks it. Each bishop stays on the same colour of square for the whole game, so you have a "light-squared" and a "dark-squared" bishop. Two bishops working together cover all squares.', { fen: 'k7/8/8/8/3B4/8/8/7K w - - 0 1' }),
    { type: 'exercise', kind: 'reach', prompt: 'Click every square the bishop on d4 can move to.', fen: 'k7/8/8/8/3B4/8/8/7K w - - 0 1', square: 'd4' },
  ] },
  { id: 'rooks', level: 'beginner', category: 'Fundamentals', title: 'The rook', summary: 'Straight-line power on files and ranks.', minutes: 3, steps: [
    T('Straight lines', 'Rooks move any distance horizontally or vertically. They are strongest on **open files** (files with no pawns) and on the seventh rank. A rook is worth about five pawns.', { fen: 'k7/8/8/8/3R4/8/8/7K w - - 0 1' }),
    { type: 'exercise', kind: 'reach', prompt: 'Click every square the rook on d4 can move to (14 squares).', fen: 'k7/8/8/8/3R4/8/8/7K w - - 0 1', square: 'd4' },
  ] },
  { id: 'queens', level: 'beginner', category: 'Fundamentals', title: 'The queen', summary: 'Rook plus bishop \u2014 the strongest piece.', minutes: 3, steps: [
    T('The most powerful piece', 'The queen moves like a rook and a bishop combined. She is worth about nine pawns, so don\'t bring her out too early \u2014 she can be chased by lesser pieces.', { fen: 'k7/8/8/8/3Q4/8/8/7K w - - 0 1' }),
    { type: 'exercise', kind: 'reach', prompt: 'Click every square the queen on d4 can reach.', fen: 'k7/8/8/8/3Q4/8/8/7K w - - 0 1', square: 'd4' },
  ] },
  { id: 'kings', level: 'beginner', category: 'Fundamentals', title: 'The king', summary: 'One step at a time \u2014 and never into check.', minutes: 3, steps: [
    T('Slow but vital', 'The king moves one square in any direction but can **never** move to a square attacked by the opponent. Lose the king and you lose the game, so keep him safe in the opening and middlegame \u2014 and active in the endgame.', { fen: '8/8/8/8/4K3/8/8/k7 w - - 0 1' }),
    { type: 'exercise', kind: 'reach', prompt: 'Click every square the king on e4 can move to.', fen: '7k/8/8/8/4K3/8/8/8 w - - 0 1', square: 'e4' },
  ] },
  { id: 'check-mate-stalemate', level: 'beginner', category: 'Fundamentals', title: 'Check, checkmate and stalemate', summary: 'How games end.', minutes: 6, steps: [
    T('Check', 'When the king is attacked it is **in check**. You must respond immediately by moving the king, blocking, or capturing the attacker.'),
    T('Checkmate', 'If there is no way to escape check, it is **checkmate** and the game is over. The side that delivers mate wins.'),
    T('Stalemate', 'If the side to move is **not** in check but has no legal move, the game is a **draw** by stalemate. Beware: it is the most common way to throw away a won game! In this picture, Black has no legal move and is not in check.', { fen: 'k7/2Q5/1K6/8/8/8/8/8 b - - 0 1' }),
    { type: 'exercise', kind: 'move', prompt: 'White to move. Checkmate \u2014 but do NOT stalemate! (Qc7 would be stalemate.)', fen: 'k7/8/1K6/8/8/8/2Q5/8 w - - 0 1', solutions: ['c2c8'], hint: 'Put the queen on the back rank.', explain: 'Qc8# attacks a8 and b8; the king covers a7 and b7 for you. Always check that the opponent still has a legal move before you play a quiet-looking "attack".' },
    { type: 'exercise', kind: 'mate', prompt: 'Find checkmate in one.', fen: 'k7/8/1K6/8/8/8/8/7R w - - 0 1', n: 1, explain: 'Rh8# \u2014 rook gives check along the 8th rank and the white king takes away a7 and b7.' },
  ] },
  { id: 'castling', level: 'beginner', category: 'Fundamentals', title: 'Castling', summary: 'Tuck your king away and activate a rook.', minutes: 4, steps: [
    T('Two moves in one', 'Castling moves the king two squares toward a rook and the rook jumps to the other side of the king. You may castle only if: neither piece has moved, no pieces stand between them, the king is not in check, and does not pass through or land on an attacked square.', { fen: 'r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 0 1' }),
    { type: 'exercise', kind: 'move', prompt: 'Castle kingside (short castling).', fen: 'r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 0 1', solutions: ['e1g1'], hint: 'Move your king two squares toward the h1 rook.', explain: 'Castling short gets your king behind the pawns and brings the rook to the centre. Do it early!' },
  ] },
  { id: 'special-pawn-moves', level: 'beginner', category: 'Fundamentals', title: 'En passant and promotion', summary: 'The two special pawn rules.', minutes: 5, steps: [
    T('En passant', 'If a pawn moves two squares and lands beside an enemy pawn, that enemy pawn may capture it "in passing" \u2014 as if it had moved just one square. You must do it immediately or lose the right.'),
    { type: 'exercise', kind: 'move', prompt: 'Black has just played ...f7-f5. Capture it en passant.', fen: 'rnbqkbnr/ppp1p1pp/8/3pPp2/8/8/PPPP1PPP/RNBQKBNR w KQkq f6 0 3', solutions: ['e5f6'], hint: 'Your e5 pawn captures onto f6, the square the pawn skipped.', explain: 'exf6 e.p. removes the f5 pawn even though it is not on f6.' },
    T('Promotion', 'A pawn that reaches the far rank must become a queen, rook, bishop or knight. Nearly always you choose the queen.'),
    { type: 'exercise', kind: 'move', prompt: 'Promote the pawn to a queen.', fen: '7k/4P3/8/8/8/8/8/K7 w - - 0 1', solutions: ['e7e8q'], hint: 'Move to e8 and choose a queen.', explain: 'e8=Q+ gives check and a second queen.' },
  ] },
  { id: 'piece-values', level: 'beginner', category: 'Fundamentals', title: 'Piece values and trades', summary: 'Knowing what is worth what.', minutes: 4, steps: [
    T('Counting material', 'Pawn = 1, knight = 3, bishop = 3, rook = 5, queen = 9. These are guidelines: a trade is good when you receive more value than you give. Two minor pieces for a rook and pawn is roughly equal.'),
    { type: 'exercise', kind: 'choice', prompt: 'You can capture a bishop with your rook, but the bishop is protected by a pawn. What happens?', options: ['You win material', 'You lose about two points (5 for 3)', 'It is an even trade'], answer: 1, explain: 'Rook (5) for bishop (3) loses two points of material, unless there is a bigger tactical gain.' },
    { type: 'exercise', kind: 'choice', prompt: 'Which trade favours you?', options: ['Your knight for their rook', 'Your queen for their bishop', 'Your rook for their pawn'], answer: 0, explain: 'Knight (3) for a rook (5) wins the "exchange" \u2014 two points.' },
  ] },
  { id: 'loose-pieces', level: 'beginner', category: 'Tactics', title: 'Spot the loose piece', summary: 'The first question: is it defended?', minutes: 4, steps: [
    T('Loose pieces drop off', 'Before every move ask: "What is attacked? What is undefended?" Most games below 1000 are decided by a piece being left hanging.'),
    { type: 'exercise', kind: 'move', prompt: 'Black\'s queen has just taken a pawn on h4. Punish it.', fen: 'rnb1kbnr/pppp1ppp/8/4p3/4P2q/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 1', solutions: ['f3h4'], hint: 'Something attacks h4 already.', explain: 'Nxh4 wins the queen for nothing \u2014 the queen went out too early and wasn\'t protected.' },
  ] },

  // ---------------------------------------------------------------- INTERMEDIATE / Tactics
  { id: 'forks', level: 'intermediate', category: 'Tactics', title: 'Forks', summary: 'One piece, two targets.', minutes: 5, steps: [
    T('Double attack', 'A **fork** is a single move that attacks two or more enemy pieces at once. Knights are the best forkers because most pieces cannot attack them back; pawns and queens fork too.', { fen: 'r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1', arrows: [['d5', 'c7'], ['c7', 'a8'], ['c7', 'e8']] }),
    { type: 'exercise', kind: 'move', prompt: 'Find the knight fork.', fen: 'r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1', solutions: ['d5c7'], hint: 'A "royal fork" attacks the king and a rook together.', explain: 'Nc7+ attacks the king on e8 and the rook on a8. The king must move, then you win the rook.' },
  ] },
  { id: 'pins', level: 'intermediate', category: 'Tactics', title: 'Pins', summary: 'A piece that cannot move without exposing something bigger.', minutes: 5, steps: [
    T('Absolute and relative pins', 'A piece is **pinned** when moving it would expose a more valuable piece behind it. If the piece behind is the king, the pin is **absolute** \u2014 the pinned piece cannot legally move at all.', { fen: '4k3/4q3/8/8/8/8/8/4RK2 w - - 0 1' }),
    { type: 'exercise', kind: 'move', prompt: 'Black\'s queen is pinned to its king. Win it.', fen: '4k3/4q3/8/8/8/8/8/4RK2 w - - 0 1', solutions: ['e1e7'], hint: 'The rook already attacks the queen.', explain: 'Rxe7+ Kxe7 \u2014 you gave up a rook (5) for a queen (9). The queen could not escape because moving it would put its own king in check.' },
  ] },
  { id: 'skewers', level: 'intermediate', category: 'Tactics', title: 'Skewers', summary: 'A pin in reverse \u2014 the big piece must run.', minutes: 4, steps: [
    T('Reverse pin', 'In a **skewer** you attack a valuable piece that has to move, exposing a less valuable (or equal) piece behind it, which you then capture.', { fen: 'q2k4/8/8/8/8/8/8/1K5R w - - 0 1' }),
    { type: 'exercise', kind: 'move', prompt: 'Skewer the king and the queen.', fen: 'q2k4/8/8/8/8/8/8/1K5R w - - 0 1', solutions: ['h1h8'], hint: 'Check along the 8th rank.', explain: 'Rh8+ forces the king off the rank and then Rxa8 wins the queen.' },
  ] },
  { id: 'discovered-attacks', level: 'intermediate', category: 'Tactics', title: 'Discovered attacks', summary: 'Move one piece, unleash another.', minutes: 5, steps: [
    T('Open the line', 'A **discovered attack** happens when you move a piece out of the way and reveal an attack from a piece behind it. If the revealed piece gives check, it is a *discovered check* \u2014 and the moving piece can do anything it likes.', { fen: 'q3k3/8/8/8/4B3/8/8/4R1K1 w - - 0 1' }),
    { type: 'exercise', kind: 'move', prompt: 'Win the queen with a discovered check.', fen: 'q3k3/8/8/8/4B3/8/8/4R1K1 w - - 0 1', solutions: ['e4a8'], hint: 'The bishop can capture something while uncovering the rook.', explain: 'Bxa8+ takes the queen and uncovers Re1\'s check. Black has no time to recapture.' },
  ] },
  { id: 'back-rank', level: 'intermediate', category: 'Checkmate patterns', title: 'Back-rank mate', summary: 'The king trapped behind its own pawns.', minutes: 4, steps: [
    T('Pawns in the way', 'A king on the back rank boxed in by its own pawns can be mated by a rook or queen. Give your king "luft" (a flight square) with h3 or h6 to avoid it, and look for the pattern against the opponent.', { fen: '6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1' }),
    { type: 'exercise', kind: 'mate', prompt: 'Checkmate in one.', fen: '6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1', n: 1, explain: 'Ra8# \u2014 the f7, g7 and h7 pawns take away every flight square.' },
  ] },
  { id: 'smothered-mate', level: 'intermediate', category: 'Checkmate patterns', title: 'Smothered mate', summary: 'A knight delivers mate to a boxed-in king.', minutes: 4, steps: [
    T('Boxed in by friends', 'A **smothered mate** is delivered by a knight because it is the only piece that checks from a distance without needing a line. The king\'s own pieces take away all its squares.', { fen: '6rk/6pp/8/6N1/8/8/8/K7 w - - 0 1' }),
    { type: 'exercise', kind: 'mate', prompt: 'Checkmate in one.', fen: '6rk/6pp/8/6N1/8/8/8/K7 w - - 0 1', n: 1, explain: 'Nf7#. The king on h8 is hemmed in by its own rook and pawns.' },
  ] },
  { id: 'two-rook-mate', level: 'intermediate', category: 'Checkmate patterns', title: 'The ladder mate', summary: 'Two rooks chase the king off the board.', minutes: 4, steps: [
    T('Rook after rook', 'Two rooks can force mate on their own: one rook cuts off a rank, the other gives check; then the roles swap, rung by rung, until the king is on the edge.', { fen: '7k/8/8/8/8/8/1R6/R6K w - - 0 1' }),
    { type: 'exercise', kind: 'mate', prompt: 'Find mate in two.', fen: '7k/8/8/8/8/8/1R6/R6K w - - 0 1', n: 2, explain: 'Ra7 (or Rb7) cuts off the seventh rank; after the king shuffles, the other rook mates on the eighth.' },
  ] },
  { id: 'opening-principles', level: 'intermediate', category: 'Opening theory', title: 'Opening principles', summary: 'Centre, development, king safety.', minutes: 5, steps: [
    T('Three goals', '1) **Control the centre** with pawns (e4/d4) and pieces. 2) **Develop** knights and bishops before moving anything twice. 3) **Castle** early. Don\'t bring the queen out early, and don\'t make unnecessary pawn moves.', { fen: 'r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4' }),
    { type: 'exercise', kind: 'choice', prompt: 'After 1.e4 e5 2.Nf3 Nc6 \u2014 which move best follows the principles?', options: ['3.Bc4 (develop with a threat)', '3.h4 (a wing pawn)', '3.Qh5 (early queen)'], answer: 0, explain: 'Bc4 develops, eyes f7 and prepares castling. The others waste time or expose the queen.' },
    { type: 'exercise', kind: 'choice', prompt: 'Why is moving the same piece twice in the opening usually a mistake?', options: ['It loses a tempo (a move) while the opponent develops', 'It breaks a rule of chess', 'It is illegal'], answer: 0, explain: 'Each tempo spent shuffling is a developing move your opponent gets for free.' },
  ] },
  { id: 'centre-control', level: 'intermediate', category: 'Strategy', title: 'Controlling the centre', summary: 'Why d4, e4, d5, e5 matter.', minutes: 4, steps: [
    T('Central pieces see more', 'Pieces in the centre attack more squares and can switch flanks quickly. Occupy the centre with pawns, then support them with pieces; or control it from a distance with fianchettoed bishops.', { fen: 'rnbqkbnr/pppp1ppp/8/4p3/3PP3/8/PPP2PPP/RNBQKBNR b KQkq d3 0 2' }),
    { type: 'exercise', kind: 'choice', prompt: 'A knight on d4 attacks 8 squares; on a1 it attacks 2. What does this teach you?', options: ['Develop knights toward the centre', 'Keep knights on the edge', 'Knights are weak pieces'], answer: 0, explain: 'Mobility is power. Put your pieces where they attack the most squares.' },
  ] },
  { id: 'pawn-structure', level: 'intermediate', category: 'Strategy', title: 'Pawn structure basics', summary: 'Isolated, doubled, backward and passed pawns.', minutes: 6, steps: [
    T('Pawns never go back', 'Pawn weaknesses are permanent. **Isolated pawns** have no friendly pawn on adjacent files. **Doubled pawns** are two on the same file. **Backward pawns** cannot be defended by other pawns. A **passed pawn** has no enemy pawn ahead on its file or the adjacent ones \u2014 and passed pawns are strong, especially in the endgame.', { fen: '4k3/pp3pp1/8/3P4/8/2P5/P4PPP/4K3 w - - 0 1', marks: ['d5', 'c3'] }),
    { type: 'exercise', kind: 'choice', prompt: 'In the diagram, which pawn is a passed pawn for White?', options: ['d5', 'c3', 'f2'], answer: 0, explain: 'No black pawn on the c-, d- or e-file can stop d5 on its way to d8. A passed pawn must be watched at all times.' },
  ] },
  { id: 'king-safety', level: 'intermediate', category: 'Strategy', title: 'King safety', summary: 'Why you castle and keep the pawn shield.', minutes: 4, steps: [
    T('Shelter first', 'After castling, the pawns in front of the king (f, g, h) are his shield. Pushing them loosens the shelter. Attackers love open files and diagonals pointing at the king.'),
    { type: 'exercise', kind: 'choice', prompt: 'Your king is castled short with pawns on f2, g2, h2. Which move weakens it most?', options: ['g4?', 'h3', 'a3'], answer: 0, explain: 'g4 opens diagonals and squares around the king. h3 creates luft but is usually fine; a3 is a distant wing move.' },
  ] },

  // ---------------------------------------------------------------- ADVANCED
  { id: 'outposts-and-bishops', level: 'advanced', category: 'Strategy', title: 'Outposts and good bishops', summary: 'Knights on strong squares, bishops with scope.', minutes: 6, steps: [
    T('Outposts', 'An **outpost** is a square deep in enemy territory that cannot be attacked by enemy pawns. A knight on such a square is often stronger than a rook. A bishop is "good" when its pawns are on the opposite colour from the bishop.', { fen: '4k3/pp3ppp/2p5/8/3N4/2P5/PP3PPP/4K3 w - - 0 1', marks: ['d4'] }),
    { type: 'exercise', kind: 'choice', prompt: 'Black has pawns on a7, b7, c6, f7, g7, h7. Why is a white knight on d4 stable?', options: ['No black pawn can ever attack d4 (no c- or e-pawn can capture it)', 'Knights cannot be captured', 'It is protected by the king'], answer: 0, explain: 'A pawn on the c- or e-file would attack d4. With those pawns gone (or advanced past), the knight is untouchable by pawns.' },
  ] },
  { id: 'open-files-seventh', level: 'advanced', category: 'Strategy', title: 'Open files and the seventh rank', summary: 'Put the rooks to work.', minutes: 5, steps: [
    T('Rooks want lines', 'Rooks need open files. Double them (one behind the other) to dominate the file and invade on the 7th rank, where they attack pawns from the side and cage the king.', { fen: '6k1/pp3ppp/8/8/8/8/PP3PPP/3RR1K1 w - - 0 1' }),
    { type: 'exercise', kind: 'move', prompt: 'Place your rook on the open d-file.', fen: '4k3/pp3ppp/8/8/8/8/PP3PPP/R5K1 w - - 0 1', solutions: ['a1d1', 'a1e1', 'a1c1', 'a1b1'], hint: 'Any open file is better than a closed one; the d-file is open.', explain: 'Rd1 puts the rook on an open file, ready to invade on d7 or d8.' },
  ] },
  { id: 'rule-of-the-square', level: 'advanced', category: 'Endgames', title: 'The rule of the square', summary: 'Can the king catch the pawn?', minutes: 5, steps: [
    T('A mental box', 'Draw a square whose side is the number of squares from the pawn to its promotion square. If the defending king can step into that square (with the right side to move), it catches the pawn. If not, the pawn queens.', { fen: '8/8/4k3/P7/8/8/8/4K3 w - - 0 1', marks: ['a5', 'a8', 'd5', 'd8'] }),
    { type: 'exercise', kind: 'choice', prompt: 'White to move: pawn a5, black king e6. Can the king stop the pawn?', options: ['No \u2014 the king is outside the square', 'Yes, it just walks to a8', 'Only if Black moves first'], answer: 0, explain: 'The pawn needs three moves; the square runs a5\u2013d5\u2013d8\u2013a8. The king on e6 is just outside it: 1.a6 Kd7 2.a7 Kc7 3.a8=Q.' },
  ] },
  { id: 'opposition', level: 'advanced', category: 'Endgames', title: 'Opposition', summary: 'The key idea in king-and-pawn endings.', minutes: 5, steps: [
    T('Face to face', 'Two kings are in **opposition** when they stand on the same file (or rank) with exactly one square between them. The side who does **not** have to move holds the opposition, forcing the other king to give way. Getting your king in front of the pawn and winning the opposition decides most pawn endings.'),
    { type: 'exercise', kind: 'choice', prompt: 'It is Black\'s move and the kings face each other with one square between. Who holds the opposition?', options: ['White (Black must give way)', 'Black', 'Neither'], answer: 0, explain: 'The side that has to move concedes ground. The player NOT to move holds the opposition.' },
  ] },
  { id: 'queen-and-king-mate', level: 'advanced', category: 'Endgames', title: 'Mate with king and queen', summary: 'Never stalemate \u2014 drive the king to the edge.', minutes: 5, steps: [
    T('The technique', 'Use the queen to confine the king to ever smaller boxes (a knight\'s move away works well), bring your king close, and mate on the edge. Always make sure the enemy king has a legal move unless you are mating.'),
    { type: 'exercise', kind: 'mate', prompt: 'Find mate in two.', fen: 'k7/8/2K5/8/8/8/8/7Q w - - 0 1', n: 2, explain: 'The white king already covers b7 and b6, so the queen only has to take away the remaining squares without stalemating.' },
  ] },
  { id: 'king-rook-mate', level: 'advanced', category: 'Endgames', title: 'Mate with king and rook', summary: 'Cut off, box in, mate.', minutes: 5, steps: [
    T('Opposition + a rook check', 'With a rook the king must help: get your king to the same file as the enemy king, take the opposition, and the rook delivers a check on the edge.', { fen: 'k7/8/2K5/8/8/8/8/7R w - - 0 1' }),
    { type: 'exercise', kind: 'mate', prompt: 'Find mate in two.', fen: 'k7/8/2K5/8/8/8/8/7R w - - 0 1', n: 2, explain: '1.Kc7 Ka7 2.Ra1#. The king takes away b7/b8 and the rook mates on the a-file.' },
  ] },

const M = {"Eight by eight": ["Ocho por ocho", "Huit par huit", "Acht mal acht", "Oito por oito", "Otto per otto"], "The board has 64 squares. Columns are called **files** (a\u2013h) and rows are **ranks** (1\u20138). Every square has a name made of its file and rank \u2014 the white king starts on e1. The bottom-right square (h1) is always a light square.": ["El tablero tiene 64 casillas. Las **columnas** (a\u2013h) y las **filas** (1\u20138) dan nombre a cada casilla: el rey blanco empieza en e1. La casilla de abajo a la derecha (h1) siempre es clara.", "L'\u00e9chiquier compte 64 cases. Les **colonnes** (a\u2013h) et les **rang\u00e9es** (1\u20138) donnent leur nom aux cases : le roi blanc commence en e1. La case en bas \u00e0 droite (h1) est toujours claire.", "Das Brett hat 64 Felder. Die **Linien** (a\u2013h) und **Reihen** (1\u20138) geben jedem Feld seinen Namen: Der wei\u00dfe K\u00f6nig startet auf e1. Das Feld unten rechts (h1) ist immer hell.", "O tabuleiro tem 64 casas. As **colunas** (a\u2013h) e as **fileiras** (1\u20138) d\u00e3o nome a cada casa: o rei branco come\u00e7a em e1. A casa em baixo \u00e0 direita (h1) \u00e9 sempre clara.", "La scacchiera ha 64 case. Le **colonne** (a\u2013h) e le **traverse** (1\u20138) danno il nome a ogni casa: il re bianco parte da e1. La casa in basso a destra (h1) \u00e8 sempre chiara."], "Setting up": ["Colocaci\u00f3n", "La mise en place", "Aufstellung", "Posi\u00e7\u00e3o inicial", "La disposizione"], "White always moves first. The queen goes on her own colour (white queen on a light square, d1). Pawns fill the second and seventh ranks. Learn this picture \u2014 every game starts here.": ["Las blancas mueven siempre primero. La dama va en su propio color (dama blanca en casilla clara, d1). Los peones ocupan la segunda y la s\u00e9ptima fila. Aprende esta imagen: todas las partidas empiezan as\u00ed.", "Les Blancs jouent toujours en premier. La dame se place sur sa couleur (dame blanche sur case claire, d1). Les pions occupent les deuxi\u00e8me et septi\u00e8me rang\u00e9es. Retenez cette image : toutes les parties commencent ainsi.", "Wei\u00df zieht immer zuerst. Die Dame steht auf ihrer eigenen Farbe (wei\u00dfe Dame auf hellem Feld, d1). Die Bauern stehen auf der zweiten und siebten Reihe. Pr\u00e4ge dir dieses Bild ein: Jede Partie beginnt so.", "As brancas jogam sempre primeiro. A dama fica na sua pr\u00f3pria cor (dama branca em casa clara, d1). Os pe\u00f5es ocupam a segunda e a s\u00e9tima fileiras. Fixe esta imagem: todas as partidas come\u00e7am assim.", "Il Bianco muove sempre per primo. La donna va sul proprio colore (donna bianca su casa chiara, d1). I pedoni occupano la seconda e la settima traversa. Fissa questa immagine: ogni partita comincia cos\u00ec."], "Writing moves": ["Escribir las jugadas", "\u00c9crire les coups", "Z\u00fcge schreiben", "Escrever as jogadas", "Scrivere le mosse"], "A move is the piece letter plus the destination: **Nf3** means a knight goes to f3. Pawn moves have no letter: **e4**. A capture adds an x: **Bxc6**. K = king, Q = queen, R = rook, B = bishop, N = knight.": ["Una jugada es la letra de la pieza m\u00e1s la casilla de destino: **Nf3** significa que un caballo va a f3. Los peones no llevan letra: **e4**. Una captura a\u00f1ade una x: **Bxc6**. K = rey, Q = dama, R = torre, B = alfil, N = caballo.", "Un coup s'\u00e9crit avec la lettre de la pi\u00e8ce et la case d'arriv\u00e9e : **Nf3** signifie qu'un cavalier va en f3. Les coups de pion n'ont pas de lettre : **e4**. Une prise ajoute un x : **Bxc6**. K = roi, Q = dame, R = tour, B = fou, N = cavalier.", "Ein Zug besteht aus dem Figurenbuchstaben plus dem Zielfeld: **Nf3** bedeutet, ein Springer geht nach f3. Bauernz\u00fcge haben keinen Buchstaben: **e4**. Ein Schlagzug f\u00fcgt ein x hinzu: **Bxc6**. K = K\u00f6nig, Q = Dame, R = Turm, B = L\u00e4ufer, N = Springer.", "Uma jogada \u00e9 a letra da pe\u00e7a mais a casa de destino: **Nf3** significa que um cavalo vai para f3. Os pe\u00f5es n\u00e3o t\u00eam letra: **e4**. Uma captura acrescenta um x: **Bxc6**. K = rei, Q = dama, R = torre, B = bispo, N = cavalo.", "Una mossa \u00e8 la lettera del pezzo pi\u00f9 la casa di arrivo: **Nf3** significa che un cavallo va in f3. Le mosse di pedone non hanno lettera: **e4**. Una cattura aggiunge una x: **Bxc6**. K = re, Q = donna, R = torre, B = alfiere, N = cavallo."], "Play the pawn from e2 to e4 (written e4).": ["Juega el pe\u00f3n de e2 a e4 (se escribe e4).", "Jouez le pion de e2 en e4 (not\u00e9 e4).", "Ziehe den Bauern von e2 nach e4 (geschrieben e4).", "Jogue o pe\u00e3o de e2 para e4 (escreve-se e4).", "Gioca il pedone da e2 a e4 (si scrive e4)."], "The pawn on e2 may move two squares on its first move.": ["El pe\u00f3n de e2 puede avanzar dos casillas en su primera jugada.", "Le pion en e2 peut avancer de deux cases \u00e0 son premier coup.", "Der Bauer auf e2 darf beim ersten Zug zwei Felder ziehen.", "O pe\u00e3o em e2 pode avan\u00e7ar duas casas na primeira jogada.", "Il pedone in e2 pu\u00f2 avanzare di due case alla prima mossa."], "e4 takes space in the centre and opens lines for the queen and bishop.": ["e4 gana espacio en el centro y abre l\u00edneas para la dama y el alfil.", "e4 prend de l'espace au centre et ouvre des lignes pour la dame et le fou.", "e4 gewinnt Raum im Zentrum und \u00f6ffnet Linien f\u00fcr Dame und L\u00e4ufer.", "e4 ganha espa\u00e7o no centro e abre linhas para a dama e o bispo.", "e4 guadagna spazio al centro e apre linee per la donna e l'alfiere."], "Develop a knight: play Nf3.": ["Desarrolla un caballo: juega Nf3.", "D\u00e9veloppez un cavalier : jouez Nf3.", "Entwickle einen Springer: Spiele Nf3.", "Desenvolva um cavalo: jogue Nf3.", "Sviluppa un cavallo: gioca Nf3."], "The knight on g1 jumps to f3.": ["El caballo de g1 salta a f3.", "Le cavalier en g1 saute en f3.", "Der Springer von g1 springt nach f3.", "O cavalo de g1 salta para f3.", "Il cavallo in g1 salta in f3."], "Knights belong near the centre. Nf3 also eyes the d4 and e5 squares.": ["Los caballos pertenecen al centro. Nf3 adem\u00e1s vigila las casillas d4 y e5.", "Les cavaliers sont mieux plac\u00e9s pr\u00e8s du centre. Nf3 surveille aussi les cases d4 et e5.", "Springer geh\u00f6ren ins Zentrum. Nf3 kontrolliert au\u00dferdem d4 und e5.", "Os cavalos pertencem ao centro. Nf3 tamb\u00e9m vigia as casas d4 e e5.", "I cavalli stanno bene vicino al centro. Nf3 controlla anche le case d4 ed e5."], "Forward only": ["Solo hacia delante", "Seulement vers l'avant", "Nur vorw\u00e4rts", "S\u00f3 para a frente", "Solo in avanti"], "Pawns move one square forward. From their starting square they may move two. They never move backward, and they cannot capture the piece in front of them.": ["Los peones avanzan una casilla. Desde su casilla inicial pueden avanzar dos. Nunca retroceden y no pueden capturar la pieza que tienen delante.", "Les pions avancent d'une case. De leur case de d\u00e9part, ils peuvent avancer de deux. Ils ne reculent jamais et ne peuvent pas prendre la pi\u00e8ce qui leur fait face.", "Bauern ziehen ein Feld vorw\u00e4rts. Vom Startfeld aus d\u00fcrfen sie zwei ziehen. Sie gehen nie zur\u00fcck und k\u00f6nnen die Figur direkt vor sich nicht schlagen.", "Os pe\u00f5es avan\u00e7am uma casa. Da casa inicial podem avan\u00e7ar duas. Nunca recuam e n\u00e3o podem capturar a pe\u00e7a \u00e0 sua frente.", "I pedoni avanzano di una casa. Dalla casa di partenza possono avanzare di due. Non vanno mai indietro e non possono catturare il pezzo davanti a loro."], "Click every square the pawn on e2 can move to.": ["Haz clic en cada casilla a la que puede ir el pe\u00f3n de e2.", "Cliquez sur chaque case o\u00f9 peut aller le pion en e2.", "Klicke auf jedes Feld, auf das der Bauer auf e2 ziehen kann.", "Clique em cada casa para onde o pe\u00e3o de e2 se pode mover.", "Clicca su ogni casa in cui pu\u00f2 andare il pedone in e2."], "Capturing": ["Capturar", "Capturer", "Schlagen", "Capturar", "Catturare"], "Pawns capture one square diagonally forward \u2014 different from how they move. That is why pawns can block each other head-on.": ["Los peones capturan una casilla en diagonal hacia delante, distinto de como se mueven. Por eso los peones pueden bloquearse de frente.", "Les pions prennent en diagonale vers l'avant, diff\u00e9remment de leur marche. C'est pourquoi des pions peuvent se bloquer de face.", "Bauern schlagen ein Feld diagonal vorw\u00e4rts, anders als sie ziehen. Deshalb k\u00f6nnen sich Bauern frontal blockieren.", "Os pe\u00f5es capturam uma casa na diagonal para a frente, ao contr\u00e1rio de como se movem. Por isso os pe\u00f5es podem bloquear-se de frente.", "I pedoni catturano in diagonale in avanti, diversamente da come si muovono. Per questo i pedoni possono bloccarsi frontalmente."], "Capture the pawn on d5 with your e4 pawn.": ["Captura el pe\u00f3n de d5 con tu pe\u00f3n de e4.", "Prenez le pion en d5 avec votre pion e4.", "Schlage den Bauern auf d5 mit deinem e4-Bauern.", "Capture o pe\u00e3o de d5 com o seu pe\u00e3o de e4.", "Cattura il pedone in d5 con il tuo pedone e4."], "Diagonally forward.": ["En diagonal hacia delante.", "En diagonale vers l'avant.", "Diagonal vorw\u00e4rts.", "Na diagonal para a frente.", "In diagonale in avanti."], "exd5 wins a pawn and opens the d-file for Black's queen to recapture \u2014 a classic Scandinavian Defence.": ["exd5 gana un pe\u00f3n y abre la columna d para que la dama negra recapture: una cl\u00e1sica Defensa Escandinava.", "exd5 gagne un pion et ouvre la colonne d pour que la dame noire reprenne : une D\u00e9fense scandinave classique.", "exd5 gewinnt einen Bauern und \u00f6ffnet die d-Linie, damit die schwarze Dame zur\u00fcckschlagen kann: eine klassische Skandinavische Verteidigung.", "exd5 ganha um pe\u00e3o e abre a coluna d para a dama preta recapturar: uma cl\u00e1ssica Defesa Escandinava.", "exd5 vince un pedone e apre la colonna d perch\u00e9 la donna nera riprenda: una classica Difesa Scandinava."], "An L-shaped jump": ["Un salto en L", "Un saut en L", "Ein L-f\u00f6rmiger Sprung", "Um salto em L", "Un salto a L"], "The knight moves two squares in one direction and one square sideways. It is the only piece that **jumps over** others. In the centre it controls eight squares; in a corner only two.": ["El caballo se mueve dos casillas en una direcci\u00f3n y una de lado. Es la \u00fanica pieza que **salta sobre** las dem\u00e1s. En el centro controla ocho casillas; en una esquina, solo dos.", "Le cavalier se d\u00e9place de deux cases dans une direction et d'une case de c\u00f4t\u00e9. C'est la seule pi\u00e8ce qui **saute par-dessus** les autres. Au centre il contr\u00f4le huit cases ; dans un coin, deux seulement.", "Der Springer zieht zwei Felder in eine Richtung und eins zur Seite. Er ist die einzige Figur, die **\u00fcber andere springt**. In der Mitte kontrolliert er acht Felder, in der Ecke nur zwei.", "O cavalo move-se duas casas numa dire\u00e7\u00e3o e uma de lado. \u00c9 a \u00fanica pe\u00e7a que **salta por cima** das outras. No centro controla oito casas; num canto, s\u00f3 duas.", "Il cavallo si muove di due case in una direzione e una di lato. \u00c8 l'unico pezzo che **salta sopra** gli altri. Al centro controlla otto case; in un angolo solo due."], "Click all eight squares the knight on d4 can reach.": ["Haz clic en las ocho casillas a las que llega el caballo de d4.", "Cliquez sur les huit cases que peut atteindre le cavalier en d4.", "Klicke auf alle acht Felder, die der Springer auf d4 erreichen kann.", "Clique nas oito casas que o cavalo de d4 pode alcan\u00e7ar.", "Clicca su tutte e otto le case che il cavallo in d4 pu\u00f2 raggiungere."], "Rule of thumb": ["Regla pr\u00e1ctica", "R\u00e8gle pratique", "Faustregel", "Regra pr\u00e1tica", "Regola pratica"], "\"A knight on the rim is dim.\" Knights are strongest in the centre where they attack the most squares.": ["\u00abCaballo en el borde, caballo sin fuerza.\u00bb Los caballos son m\u00e1s fuertes en el centro, donde atacan m\u00e1s casillas.", "\u00ab Cavalier au bord, cavalier mort. \u00bb Les cavaliers sont plus forts au centre, o\u00f9 ils attaquent le plus de cases.", "\u201eEin Springer am Rand ist eine Schande.\u201c Springer sind im Zentrum am st\u00e4rksten, wo sie die meisten Felder angreifen.", "\u00abCavalo na borda, cavalo sem for\u00e7a.\u00bb Os cavalos s\u00e3o mais fortes no centro, onde atacam mais casas.", "\u00abCavallo in bordo, cavallo perso.\u00bb I cavalli sono pi\u00f9 forti al centro, dove attaccano pi\u00f9 case."], "Diagonals only": ["Solo diagonales", "Uniquement en diagonale", "Nur Diagonalen", "S\u00f3 diagonais", "Solo diagonali"], "A bishop slides any distance along a diagonal until something blocks it. Each bishop stays on the same colour of square for the whole game, so you have a \"light-squared\" and a \"dark-squared\" bishop. Two bishops working together cover all squares.": ["Un alfil se desliza cualquier distancia por una diagonal hasta que algo lo bloquea. Cada alfil se queda en el mismo color de casilla toda la partida, as\u00ed que hay un alfil \u00abde casillas blancas\u00bb y otro \u00abde casillas negras\u00bb. Los dos alfiles juntos cubren todas las casillas.", "Un fou glisse sur n'importe quelle distance en diagonale jusqu'\u00e0 un obstacle. Chaque fou reste sur la m\u00eame couleur de case toute la partie : on a donc un fou \u00ab de cases blanches \u00bb et un fou \u00ab de cases noires \u00bb. Les deux fous ensemble couvrent toutes les cases.", "Ein L\u00e4ufer gleitet beliebig weit entlang einer Diagonale, bis etwas im Weg steht. Jeder L\u00e4ufer bleibt die ganze Partie auf derselben Feldfarbe, deshalb gibt es einen \u201ewei\u00dffeldrigen\u201c und einen \u201eschwarzfeldrigen\u201c L\u00e4ufer. Zwei L\u00e4ufer zusammen decken alle Felder ab.", "Um bispo desliza qualquer dist\u00e2ncia numa diagonal at\u00e9 algo o bloquear. Cada bispo fica na mesma cor de casa durante toda
